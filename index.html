<script>
/* ===== NauMovie · halaman detail + alur pemutar =====
   Sistem: progres per episode, subscribe + notifikasi episode baru, share, unduh,
   daftar episode (cari / urut / grid), edit info judul (admin).
   Semua tersambung ke Supabase; kalau tabel/kolom baru belum ada, fitur terkait
   menampilkan pesan jelas dan sisa aplikasi tetap jalan. */

Object.assign(P, {
    share: 'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4',
    bell: 'M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 0 0 4 0',
    chev: 'M6 15l6-6 6 6',
    grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
    list: 'M4 6h16M4 12h16M4 18h16',
    verified: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM8 12l3 3 5-6'
});

const DAYS = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const dtK = n => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(n); };
const dtDate = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
const dtDur = s => { s = Math.round(s || 0); if (!s) return ''; const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h}j ${m}m` : `${Math.max(1, Math.round(s / 60))}m`; };
const lsg = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const lss = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };

/* ---------------- progres per episode ---------------- */
const EPG = {};   // titleId -> { episodeId: baris episode_progress }
const SUBS = {};  // titleId -> baris subscriptions | null
let EP_OK = true, HIST_DUR = true, SUB_OK = true;

async function dtLoad(id) {
    const [a, b] = await Promise.all([
        sb.from('episode_progress').select('episode_id,progress,duration,completed,updated_at').eq('user_id', me.id).eq('title_id', id),
        sb.from('subscriptions').select('title_id,seen_at').eq('user_id', me.id).eq('title_id', id).maybeSingle()
    ]);
    const rows = {};
    EP_OK = !a.error;
    if (!a.error) (a.data || []).forEach(r => { rows[r.episode_id] = r; });
    EPG[id] = rows;
    SUB_OK = !(b.error && /subscriptions|relation|schema cache|does not exist/i.test(b.error.message || ''));
    SUBS[id] = b.error ? null : (b.data || null);
}

// status satu episode: dari episode_progress, atau dari riwayat lama kalau barisnya belum ada
function dtEp(id, e, hist) {
    const r = (EPG[id] || {})[e.id];
    const dur = (r && r.duration) || e.duration || 0;
    let prog = r ? (r.progress || 0) : 0;
    const done = !!(r && r.completed);
    if (!r && hist && hist.episode_id == e.id && hist.progress > 5) prog = hist.progress;
    const pct = done ? 100 : dur ? Math.min(99, Math.round(prog / dur * 100)) : 0;
    return { prog, dur, done, pct, started: done || prog > 5 };
}

function dtEpText(x) {
    if (x.done) return 'Selesai';
    if (!x.started) return 'Belum ditonton';
    return x.dur ? `Ditonton ${x.pct}% · ${fmtT(x.prog)}` : `Ditonton ${fmtT(x.prog)}`;
}

function dtOverall(t, eps, hist) {
    if (eps.length) {
        let s = 0;
        eps.forEach(e => { const x = dtEp(t.id, e, hist); s += x.done ? 1 : x.pct / 100; });
        return Math.round(s / eps.length * 100);
    }
    if (hist && hist.progress > 5 && hist.duration) return Math.min(100, Math.round(hist.progress / hist.duration * 100));
    return 0;
}

// episode yang akan diputar oleh tombol Tonton
function dtTarget(t, eps, hist) {
    if (!eps.length) return null;
    const rows = EPG[t.id] || {};
    const prog = eps.map(e => ({ e, x: dtEp(t.id, e, hist), at: rows[e.id] ? new Date(rows[e.id].updated_at).getTime() : 0 }))
        .filter(o => o.x.started && !o.x.done).sort((a, b) => b.at - a.at);
    if (prog.length) return { e: prog[0].e, mode: 'resume' };
    let last = -1;
    eps.forEach((e, i) => { if (dtEp(t.id, e, hist).done) last = i; });
    if (last < 0) return { e: eps[0], mode: 'start' };
    if (last < eps.length - 1) return { e: eps[last + 1], mode: 'next' };
    return { e: eps[0], mode: 'replay' };
}

// posisi mulai saat sebuah episode dibuka (0 = dari awal)
function dtResume(id, e, hist) {
    const x = dtEp(id, e, hist);
    if (x.done || (x.dur && x.prog > x.dur * .92)) return 0;
    return x.prog > 5 ? Math.max(0, x.prog - 2) : 0;
}

function dtResumeAt(id, e, hist) {
    if (e) return dtResume(id, e, hist);
    if (!hist || !(hist.progress > 5)) return 0;
    return hist.duration && hist.progress > hist.duration * .95 ? 0 : hist.progress;
}

// simpan progres episode. cur/dur dikirim sebagai angka supaya aman saat video sudah dilepas
function dtSaveEp(titleId, e, cur, dur, forceDone) {
    if (!EP_OK || !e) return;
    const rows = EPG[titleId] || (EPG[titleId] = {});
    const prev = rows[e.id];
    const done = !!(forceDone || (prev && prev.completed) || (dur && cur / dur >= .92));
    if (cur < 3 && !done && !prev) return;
    const row = { episode_id: e.id, progress: cur, duration: dur || (prev && prev.duration) || 0, completed: done, updated_at: new Date().toISOString() };
    rows[e.id] = row;
    sb.from('episode_progress').upsert({ user_id: me.id, title_id: titleId, ...row }).then(r => { if (r.error) EP_OK = false; }, () => { });
    if (me.role === 'admin' && dur && !e.duration) {
        e.duration = Math.round(dur);
        sb.from('episodes').update({ duration: e.duration }).eq('id', e.id).then(() => { }, () => { });
    }
}

// dipanggil tiap 8 detik, saat pindah episode, dan saat pemutar ditutup
async function dtSaveAll(id, e, vv) {
    const cur = vv.currentTime || 0, dur = vv.duration && isFinite(vv.duration) ? vv.duration : 0;
    const payload = { user_id: me.id, title_id: id, episode_id: e ? e.id : null, progress: cur, updated_at: new Date() };
    if (HIST_DUR && dur) payload.duration = dur;
    dtSaveEp(id, e, cur, dur, false);
    let { error } = await sb.from('history').upsert(payload);
    if (error && 'duration' in payload && /duration/i.test(error.message)) {
        HIST_DUR = false; delete payload.duration;
        ({ error } = await sb.from('history').upsert(payload));
    }
    return { error };
}

/* ---------------- subscribe ---------------- */
async function dtSub(id) {
    if (!SUB_OK) return toast('Fitur subscribe belum aktif. Jalankan SQL migrasi di Supabase dulu.');
    const was = !!SUBS[id];
    const { error } = was
        ? await sb.from('subscriptions').delete().eq('user_id', me.id).eq('title_id', id)
        : await sb.from('subscriptions').insert({ title_id: id });
    if (error && !/duplicate/i.test(error.message)) return toast(error.message);
    SUBS[id] = was ? null : { title_id: id, seen_at: new Date().toISOString() };
    toast(was ? 'Berhenti berlangganan' : 'Berlangganan. Kamu akan diberi tahu saat ada episode baru.');
    return true;
}

// saat aplikasi dibuka: kabari kalau judul langganan punya episode baru
async function subCheck() {
    try {
        const { data: subs, error } = await sb.from('subscriptions').select('title_id,seen_at').eq('user_id', me.id);
        if (error || !subs || !subs.length) return;
        const since = subs.reduce((m, s) => new Date(s.seen_at) < new Date(m) ? s.seen_at : m, subs[0].seen_at);
        const { data: eps } = await sb.from('episodes').select('title_id,created_at').in('title_id', subs.map(s => s.title_id)).gt('created_at', since);
        const seen = Object.fromEntries(subs.map(s => [s.title_id, s.seen_at]));
        const fresh = [...new Set((eps || []).filter(e => new Date(e.created_at) > new Date(seen[e.title_id])).map(e => e.title_id))];
        if (!fresh.length) return;
        const t = titles.find(x => x.id == fresh[0]);
        toast(fresh.length > 1 ? `${fresh.length} judul langgananmu punya episode baru` : `Episode baru: ${t ? t.title : 'judul langgananmu'}`);
    } catch (e) { }
}

/* ---------------- share & unduh ---------------- */
async function dtShare(t) {
    const url = `${location.origin}${location.pathname}?t=${t.id}`;
    try { if (navigator.share) { await navigator.share({ title: t.title, text: `Nonton ${t.title} di NauMovie`, url }); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast('Link disalin'); }
    catch (e) { prompt('Salin link ini:', url); }
}

function dtDownload(t, e) {
    const u = (pickSrc(e) || {}).url || e.video_url;
    if (!u) return toast('Sumber video belum tersedia');
    if (/\.m3u8(\?|#|$)/i.test(u)) return toast('Episode ini berformat streaming (m3u8), belum bisa diunduh');
    const a = document.createElement('a');
    a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.download = `${t.title} - Ep ${e.number}.mp4`;
    document.body.appendChild(a); a.click(); a.remove();
    toast(`Membuka unduhan Ep ${e.number}`);
}

    const b = document.getElementById('flike');

    const st = FS[id];

}
{
    const _ap = actsPaint; actsPaint = function (id) { _ap(id); dtPaintHeart(id); };

    const _pr = paintRating; paintRating = function (id) { _pr(id); document.querySelectorAll(`[data-dtr="${id}"]`).forEach(el => { el.innerHTML = `${ic('star')} ${ratings[id] ? ratings[id].avg : 'N/A'}`; }); };
}

/* ---------------- edit info judul (admin) ---------------- */
function dtEdit(t, done) {
    const old = document.getElementById('dted'); if (old) old.remove();
    const m = document.createElement('div');
    m.className = 'modal'; m.id = 'dted';
    m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', 'Edit info judul');
    const v = k => esc(t[k] ?? '');
    const st = String(t.status || '');
    m.innerHTML = `<div class="sheet glass pad"><h2>${ic('tool')} Edit info judul</h2>
<div class="dt-fld"><label for="ed_studio">Studio</label><input id="ed_studio" maxlength="80" value="${v('studio')}"></div>
<div class="dt-fld"><label for="ed_label">Label</label><input id="ed_label" maxlength="30" placeholder="TV, Movie, OVA" value="${v('label')}"></div>
<div class="dt-fld"><label for="ed_tags">Tags (pisahkan koma)</label><input id="ed_tags" maxlength="200" value="${v('tags')}"></div>
<div class="dt-fld"><label for="ed_rel">Tanggal rilis</label><input id="ed_rel" type="date" value="${esc(String(t.release_date || '').slice(0, 10))}"></div>
<div class="dt-fld"><label for="ed_st">Status</label><select id="ed_st"><option value="">Belum diatur</option><option value="ongoing" ${st === 'ongoing' ? 'selected' : ''}>Ongoing</option><option value="completed" ${st === 'completed' ? 'selected' : ''}>Tamat</option><option value="upcoming" ${st === 'upcoming' ? 'selected' : ''}>Segera tayang</option></select></div>
<div class="dt-fld"><label for="ed_day">Hari tayang</label><select id="ed_day"><option value="">Tidak ada</option>${DAYS.map((d, i) => `<option value="${i}" ${t.air_day != null && t.air_day !== '' && +t.air_day === i ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
<div class="dt-fld"><label for="ed_time">Jam tayang (WIB)</label><input id="ed_time" type="time" value="${esc(String(t.air_time || '').slice(0, 5))}"></div>
<div class="libfoot"><button class="btn sm ghost" id="ed_x">Batal</button><button class="btn sm" id="ed_ok">Simpan</button></div></div>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    m.onclick = e => { if (e.target === m) close(); };
    m.querySelector('#ed_x').onclick = close;
    m.querySelector('#ed_ok').onclick = async () => {
        const g = s => m.querySelector(s).value.trim();
        const patch = {
            studio: g('#ed_studio') || null, label: g('#ed_label') || null, tags: g('#ed_tags') || null,
            release_date: g('#ed_rel') || null, status: g('#ed_st') || null,
            air_day: g('#ed_day') === '' ? null : +g('#ed_day'), air_time: g('#ed_time') || null
        };
        const btn = m.querySelector('#ed_ok'); btn.disabled = true;
        const { error } = await sb.from('titles').update(patch).eq('id', t.id);
        btn.disabled = false;
        if (error) return toast(/column|schema cache/i.test(error.message) ? 'Kolom baru belum ada. Jalankan SQL migrasi di Supabase dulu.' : error.message);
        Object.assign(t, patch);
        close(); toast('Info judul disimpan'); done();
    };
}

/* ---------------- render halaman detail ---------------- */
let DTS = { id: null, q: '', season: null, open: true, view: 'list', sort: 'new' };

function dtRender(c) {
    const { t, id, isS, root } = c, eps = c.eps(), hist = c.hist();
    if (DTS.id !== id) DTS = { id, q: '', season: null, open: true, view: lsg('nm_epv', 'list'), sort: lsg('nm_eps', 'new') };
    const tgt = isS ? dtTarget(t, eps, hist) : null;
    if (DTS.season == null) DTS.season = tgt ? tgt.e.season : (eps[0] ? eps[0].season : 1);

    const tm = t._tm && Number(t._tm.rating) > 0 ? Number(t._tm.rating).toFixed(1) : '';
    const rv = ratings[id] ? ratings[id].avg : (tm || 'N/A');
    const st = String(t.status || '').toLowerCase();
    const stTxt = { ongoing: 'ONGOING', completed: 'TAMAT', upcoming: 'SEGERA' }[st] || '';
    const rel = dtDate(t.release_date) || (t.year ? String(t.year) : '');
    const hasDay = t.air_day != null && t.air_day !== '';
    const sched = hasDay ? `${DAYS[+t.air_day] || ''}${t.air_time ? ', ' + String(t.air_time).slice(0, 5) : ''} WIB` : (t.air_time ? `${String(t.air_time).slice(0, 5)} WIB` : '');
    const chips = [
        `<span class="dt-chip s" data-dtr="${id}">${ic('star')} ${esc(rv)}</span>`,
        `<span class="dt-chip" data-dtv="${id}">${ic('eye')} ${dtK(vcount[id])}</span>`,
        rel ? `<span class="dt-chip">${ic('calendar')} ${esc(rel)}</span>` : '',
        stTxt ? `<span class="dt-chip st-${esc(st)}">${ic('verified')} ${stTxt}</span>` : '',
        sched && st !== 'completed' ? `<span class="dt-chip">${ic('clock')} ${esc(sched)}</span>` : ''
    ].join('');

    // tombol Tonton
    const movieProg = !isS && hist && hist.progress > 5 ? hist.progress : 0;
    const url = isS ? (tgt ? c.url(tgt.e) : '') : c.movieUrl();
    const label = !url ? 'Video belum tersedia'
        : isS ? ({ resume: `Lanjut Ep ${tgt.e.number}`, next: `Tonton Ep ${tgt.e.number}`, start: `Tonton Ep ${tgt.e.number}`, replay: 'Tonton ulang' }[tgt.mode])
            : (movieProg ? `Lanjut ${fmtT(movieProg)}` : 'Tonton');
    const subOn = !!SUBS[id];

    // progres
    const pct = dtOverall(t, eps, hist);
    const doneN = eps.filter(e => dtEp(id, e, hist).done).length;

    const desc = t.description ? esc(t.description) : (c.loading ? 'Mengambil sinopsis dari TMDB...' : 'Belum ada sinopsis.');
    const row = (k, v) => `<dt>${k}</dt><dd>${v ? esc(v) : '-'}</dd>`;
    const ratingTxt = ratings[id] ? String(ratings[id].avg) : (tm || 'N/A');

    root.innerHTML = `<div class="dt">
<div class="dt-hero"><i class="dt-bgi" ${bg(sm(t.thumbnail_url, 'w185'))}></i>
<div class="dt-poster" role="img" aria-label="Poster ${esc(t.title)}" ${bg(sm(t.thumbnail_url, 'w500'))}></div>
<h1 class="dt-title">${esc(t.title)}</h1><div class="dt-chips">${chips}</div></div>
<section class="dt-card"><b class="dt-h">Sinopsis</b><p class="dt-syn ${t.description ? '' : 'ld'}" id="dtSyn">${desc}</p><button class="plink" id="dtSynB" hidden>Selengkapnya</button>
<div class="dt-cta"><button class="btn big" id="dtGo" ${url ? '' : 'disabled'}>${ic('play')} <span>${esc(label)}</span></button><button class="btn big ghost ${subOn ? 'on' : ''}" id="dtSub" aria-pressed="${subOn}">${ic('bell')} <span>${subOn ? 'Berlangganan' : 'Subscribe'}</span></button></div>
<div class="dt-acts"><span class="acts" data-acts></span></div></section>
<section class="dt-card"><b class="dt-h">Progress Menonton</b><div class="dt-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="dt-ps"><b>${pct}%</b> Selesai${eps.length ? ` · ${doneN} dari ${eps.length} episode` : ''}</div></section>
<section class="dt-card"><button class="dt-fold" id="dtFold" aria-expanded="${DTS.open}"><b class="dt-h">Detail lainnya</b>${ic('chev')}</button>
<dl class="dt-rows" id="dtRows" ${DTS.open ? '' : 'hidden'}>${row('Studio', t.studio)}${row('Label', t.label || (t.type === 'series' ? 'TV' : 'Movie'))}${row('Tags', t.tags || t.category)}${row('Rilis', rel)}${row('Status', stTxt)}${row('Rating', ratingTxt)}${row('Genre', t.genre)}</dl>
${me.role === 'admin' ? '<button class="plink dt-edit" id="dtEdit">Edit info judul</button>' : ''}</section>
${isS ? `<div class="dt-eh"><h2>Episode (${eps.length})</h2><button class="dt-sq" id="dtView" aria-label="Ganti tampilan"></button><button class="dt-pillb" id="dtSort"></button></div>
<label class="dt-search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${P.search}"/></svg><input id="dtQ" type="search" inputmode="search" placeholder="Cari episode… (mis. 15)" autocomplete="off" value="${esc(DTS.q)}" aria-label="Cari episode"></label>
<div class="dt-seas" id="dtSeas"></div><div class="dt-eps" id="dtList"></div>` : ''}
</div>`;

    // sinopsis
    const syn = root.querySelector('#dtSyn'), synB = root.querySelector('#dtSynB');
    if ((t.description || '').length > 200) synB.hidden = false;
    synB.onclick = () => { const o = syn.classList.toggle('open'); synB.textContent = o ? 'Ringkas' : 'Selengkapnya'; };

    // aksi utama
    root.querySelector('#dtGo').onclick = () => c.play(tgt ? tgt.e : null);
    root.querySelector('#dtSub').onclick = async function () {
        this.disabled = true;
        const ok = await dtSub(id);
        this.disabled = false;
        if (!ok) return;
        const on = !!SUBS[id];
        this.classList.toggle('on', on); this.setAttribute('aria-pressed', on);
        this.querySelector('span').textContent = on ? 'Berlangganan' : 'Subscribe';
    };
    root.querySelector('#dtFold').onclick = function () {
        DTS.open = !DTS.open;
        this.setAttribute('aria-expanded', DTS.open);
        root.querySelector('#dtRows').hidden = !DTS.open;
    };
    const ed = root.querySelector('#dtEdit');
    if (ed) ed.onclick = () => dtEdit(t, () => c.redraw());
    filmActs(root.querySelector('[data-acts]'), t);

    // daftar episode
    if (isS) {
        const list = root.querySelector('#dtList'), seas = root.querySelector('#dtSeas');
        const viewBtn = root.querySelector('#dtView'), sortBtn = root.querySelector('#dtSort');
        const paintBtns = () => {
            viewBtn.innerHTML = ic(DTS.view === 'grid' ? 'list' : 'grid');
            sortBtn.textContent = DTS.sort === 'new' ? 'Terbaru' : 'Terlama';
        };
        const item = e => {
            const x = dtEp(id, e, hist), many = new Set(eps.map(z => z.season)).size > 1;
            const isNew = !!(c.seenAt && e.created_at && new Date(e.created_at) > new Date(c.seenAt));
            const cur = tgt && tgt.e.id === e.id;
            const bar = x.done ? 100 : x.pct;
            return `<div class="dt-ep ${cur ? 'cur' : ''}" role="button" tabindex="0" data-e="${e.id}" aria-label="Putar episode ${e.number}">
<div class="dt-th" ${bg(sm(e.thumbnail_url || t.thumbnail_url, 'w300'))}><span class="dt-play">${ic('play')}</span><span class="dt-b1">Ep ${e.number}</span>${x.dur ? `<span class="dt-b2">${dtDur(x.dur)}</span>` : ''}${bar ? `<i class="dt-tp"><b style="width:${bar}%"></b></i>` : ''}</div>
<div class="dt-ei"><div class="dt-en">${many ? `Musim ${e.season} · ` : ''}Episode ${e.number}${isNew ? '<em>Baru</em>' : ''}</div>${e.name ? `<div class="dt-ea">${esc(e.name)}</div>` : ''}<div class="dt-es ${x.done ? 'done' : ''}">${dtEpText(x)}</div></div>
<button class="dt-dl" data-dl="${e.id}" aria-label="Unduh episode ${e.number}">${ic('down')}</button></div>`;
        };
        const paint = () => {
            const q = DTS.q.trim().toLowerCase();
            const seasons = [...new Set(eps.map(e => e.season))];
            seas.innerHTML = seasons.length > 1 && !q ? seasons.map(s => `<button class="${s == DTS.season ? 'on' : ''}" data-s="${s}">Musim ${s}</button>`).join('') : '';
            let l = eps.slice();
            if (seasons.length > 1 && !q) l = l.filter(e => e.season == DTS.season);
            if (q) l = l.filter(e => /^\d+$/.test(q) ? String(e.number).startsWith(q) : String(e.name || '').toLowerCase().includes(q));
            l.sort((a, b) => (a.season - b.season) || (a.number - b.number));
            if (DTS.sort === 'new') l.reverse();
            list.className = 'dt-eps' + (DTS.view === 'grid' ? ' grid' : '');
            list.innerHTML = l.length ? l.map(item).join('') : `<div class="dt-empty">${q ? `Tidak ada episode untuk "${esc(DTS.q.trim())}". Coba nomor atau judul lain.` : 'Belum ada episode.'}</div>`;
        };
        paintBtns(); paint();
        viewBtn.onclick = () => { DTS.view = DTS.view === 'grid' ? 'list' : 'grid'; lss('nm_epv', DTS.view); paintBtns(); paint(); };
        sortBtn.onclick = () => { DTS.sort = DTS.sort === 'new' ? 'old' : 'new'; lss('nm_eps', DTS.sort); paintBtns(); paint(); };
        root.querySelector('#dtQ').oninput = e => { DTS.q = e.target.value; paint(); };
        seas.onclick = e => { const b = e.target.closest('[data-s]'); if (b) { DTS.season = +b.dataset.s; paint(); } };
        const open = el => { const e = eps.find(z => z.id == el.dataset.e); if (e) c.play(e); };
        list.onclick = e => {
            const dl = e.target.closest('[data-dl]');
            if (dl) { e.stopPropagation(); const ep = eps.find(z => z.id == dl.dataset.dl); if (ep) dtDownload(t, ep); return; }
            const it = e.target.closest('.dt-ep'); if (it) open(it);
        };
        list.onkeydown = e => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            if (e.target.closest('[data-dl]')) return;
            const it = e.target.closest('.dt-ep'); if (it) { e.preventDefault(); open(it); }
        };
    }
    refreshViews(id);
}
