        switch (a) {
            case 'back': if (fsEl() || pfs) toggleFs(); else c.onBack(); break;
            case 'play': togglePlay(); break;
            case 'rew': skip(-10); break; case 'fwd': skip(10); break;
            case 'next': { if (!canCtl()) break; const n = nextEp(); n ? pickEp(n) : toast('Ini episode terakhir'); } break;
            case 'pip': pip(); break; case 'cast': cast(); break; case 'more': moreSheet(); break;
            case 'quality': qualitySheet(); break; case 'episodes': episodesSheet(); break; case 'cc': ccSheet(); break;
            case 'fs': toggleFs(); break;
            case 'lock': locked = !locked; root.classList.toggle('np-locked', locked); qa('.np-lockbtn use').forEach(u => u.setAttribute('href', locked ? '#np-i-lock' : '#np-i-unlock')); toast(locked ? 'Layar dikunci' : 'Kunci dibuka'); show(); break;
            case 'shot': shot(); break;
            case 'mark': c.toggleSave(); setTimeout(paintMark, 350); break;
            case 'mute': v.muted = !v.muted; break;
            case 'retry': q('.np-err').classList.remove('np-on'); c.reload(v.currentTime || 0); break;
            case 'nextnow': { cancelNext(); const n = nextEp(); if (n) c.pickEp(n); } break;
            case 'nextcancel': cancelNext(); break;
        }
    }
    on(root, 'click', e => { const b = e.target.closest('[data-act]'); if (b) { act(b.dataset.act); e.stopPropagation(); } });

    // ---------- seek bar ----------
    function paint() {
        const d = v.duration || 0, cur = v.currentTime || 0;
        if (!dragging) { const p = d ? cur / d * 100 : 0; qa('.np-seek').forEach(s => { s.querySelector('.np-f').style.width = p + '%'; s.querySelector('.np-k').style.left = p + '%'; }); }
        qa('.np-tc').forEach(e => e.textContent = fmt(cur)); qa('.np-td').forEach(e => e.textContent = fmt(d));
        try { if (v.buffered.length && d) { const be = v.buffered.end(v.buffered.length - 1) / d * 100; qa('.np-seek .np-b').forEach(b => b.style.width = be + '%'); } } catch (e) { }
    }
    qa('.np-seek').forEach(s => {
        const pos = e => { const r = s.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
        const prev = r => { const p = r * 100; s.querySelector('.np-f').style.width = p + '%'; s.querySelector('.np-k').style.left = p + '%'; const pv = s.querySelector('.np-pv'); pv.style.left = p + '%'; pv.textContent = fmt(r * (v.duration || 0)); };
        s.addEventListener('pointerdown', e => { if (!canCtl()) return; dragging = true; s.classList.add('np-drag'); s.setPointerCapture(e.pointerId); prev(pos(e)); clearTimeout(hideT); e.stopPropagation(); });
        s.addEventListener('pointermove', e => { if (dragging) prev(pos(e)); });
        const end = e => { if (!dragging) return; dragging = false; s.classList.remove('np-drag'); if (v.duration) v.currentTime = pos(e) * v.duration; show(); };
        s.addEventListener('pointerup', end);
        s.addEventListener('pointercancel', () => { dragging = false; s.classList.remove('np-drag'); });
    });

    // ---------- slider kecerahan & volume (kecerahan pakai lapisan gelap, bukan CSS filter: ringan di HP kentang) ----------
    const dim = q('.np-dim');
    const setBri = p => { bri = p; const b = 0.3 + 0.9 * p / 100; dim.style.opacity = Math.max(0, 1 - b).toFixed(2); };
    const setVol = p => { vol = p; v.volume = p / 100; if (p > 0) v.muted = false; };
    function vslider(el, get, set) {
        const tr = el.querySelector('.np-tr'), fl = el.querySelector('.np-fl');
        const draw = () => fl.style.height = get() + '%'; draw();
        const at = e => { const r = tr.getBoundingClientRect(); set(clamp((r.bottom - e.clientY) / r.height * 100, 0, 100)); draw(); };
        let d = false;
        tr.addEventListener('pointerdown', e => { d = true; tr.setPointerCapture(e.pointerId); at(e); e.stopPropagation(); });
        tr.addEventListener('pointermove', e => { if (d) at(e); });
        tr.addEventListener('pointerup', () => d = false);
        return draw;
    }
    const drawB = vslider(q('.np-vsb'), () => bri, setBri), drawV = vslider(q('.np-vsv'), () => v.muted ? 0 : vol, setVol);
    setBri(bri);

    // ---------- gestur: geser kecerahan/volume/maju-mundur, tap ganda, tahan = 2x ----------
    on(root, 'pointerdown', e => {
        if (e.target.closest('[data-act],.np-seek,.np-vs,.np-sheet,.np-nextbox,.np-err,.np-lockbtn')) return;
        g = { x: e.clientX, y: e.clientY, mode: null, moved: false, b: bri, vl: v.muted ? 0 : vol, t0: v.currentTime, seekTo: null };
        g.lp = setTimeout(() => { if (g && !g.moved && !locked && !v.paused && c.quiet()) { g.mode = 'speed'; g.rate = v.playbackRate; v.playbackRate = 2; hud('▶▶ 2x'); } }, 550);
    });
    on(root, 'pointermove', e => {
        if (!g) return;
        const dx = e.clientX - g.x, dy = e.clientY - g.y;
        if (!g.mode && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
            g.moved = true; clearTimeout(g.lp);
            if (!isFs() || locked) g.mode = 'none';
            else if (Math.abs(dy) > Math.abs(dx)) g.mode = e.clientX < root.getBoundingClientRect().left + root.clientWidth / 2 ? 'bri' : 'vol';
            else g.mode = c.quiet() ? 'seek' : 'none';
        }
        const h = root.clientHeight || 1, w = root.clientWidth || 1;
        if (g.mode === 'bri') { setBri(clamp(g.b - dy / h * 130, 0, 100)); drawB(); hud('Kecerahan ' + Math.round(bri) + '%'); }
        else if (g.mode === 'vol') { setVol(clamp(g.vl - dy / h * 130, 0, 100)); drawV(); hud('Volume ' + Math.round(vol) + '%'); }
        else if (g.mode === 'seek' && v.duration) { g.seekTo = clamp(g.t0 + dx / w * 120, 0, v.duration); hud((dx >= 0 ? '⏩ ' : '⏪ ') + fmt(g.seekTo) + ' / ' + fmt(v.duration)); }
    });
    function gEnd(e, cancel) {
        if (!g) return; clearTimeout(g.lp); const s = g; g = null;
        if (s.mode === 'speed') { v.playbackRate = s.rate; return; }
        if (s.mode === 'seek' && s.seekTo != null) { v.currentTime = s.seekTo; return; }
        if (s.moved || cancel) return;
        if (locked) { root.classList.toggle('np-show'); return; }
        const now = Date.now();
        if (now - lastTap < 300) {
            clearTimeout(tapT); lastTap = 0;
            const r = root.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
            if (x < .35) skip(-10); else if (x > .65) skip(10); else togglePlay();
            return;
        }
        lastTap = now;
        tapT = setTimeout(() => { root.classList.contains('np-show') && !v.paused ? hideUI() : show(); }, 260);
    }
    on(root, 'pointerup', e => gEnd(e, false)); on(root, 'pointercancel', e => gEnd(e, true));

    // ---------- event video ----------
    on(v, 'play', () => { root.dataset.playing = '1'; root.classList.add('np-started'); show(); });
    on(v, 'pause', () => { root.dataset.playing = '0'; show(); });
    on(v, 'playing', () => { root.classList.remove('np-wait'); root.classList.add('np-started'); q('.np-err').classList.remove('np-on'); });
    on(v, 'canplay', () => root.classList.remove('np-wait'));
    ['waiting', 'seeking'].forEach(n => on(v, n, () => root.classList.add('np-wait')));
    on(v, 'seeked', () => root.classList.remove('np-wait'));
    ['timeupdate', 'progress', 'loadedmetadata', 'durationchange'].forEach(n => on(v, n, paint));
    on(v, 'volumechange', () => { qa('.np-mute use').forEach(u => u.setAttribute('href', v.muted || v.volume === 0 ? '#np-i-mute' : '#np-i-vol')); drawV(); });
    on(v, 'error', () => { if (!v._closed) showErr('Video gagal dimuat. Coba lagi atau ganti kualitas.'); });
    on(v, 'ended', () => { const n = nextEp(); if (n && localStorage.nm_auto !== '0' && c.quiet()) startNext(n); });
    v.loop = prefs.loop; v.style.objectFit = prefs.fit; v.defaultPlaybackRate = prefs.rate; v.playbackRate = prefs.rate;

    // ---------- keyboard ----------
    on(document, 'keydown', e => {
        if (/input|textarea|select|button/i.test(e.target.tagName)) return;
        const k = e.key;
        if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(); }
        else if (k === 'ArrowRight') skip(e.shiftKey ? 10 : 5);
        else if (k === 'ArrowLeft') skip(e.shiftKey ? -10 : -5);
        else if (k === 'ArrowUp' && isFs()) { e.preventDefault(); setVol(clamp(vol + 5, 0, 100)); drawV(); hud('Volume ' + vol + '%'); }
        else if (k === 'ArrowDown' && isFs()) { e.preventDefault(); setVol(clamp(vol - 5, 0, 100)); drawV(); hud('Volume ' + vol + '%'); }
        else if (k === 'm') v.muted = !v.muted;
        else if (k === 'f') toggleFs();
        else if (k === 'n') act('next');
        else return;
        show();
    });

    // ---------- status bar (jam, baterai, jaringan) ----------
    function tick() {
        q('.np-clock').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');
        const cn = navigator.connection;
        q('.np-net').textContent = !navigator.onLine ? 'OFFLINE' : (cn && cn.type === 'wifi') ? 'WIFI' : cn && cn.effectiveType ? cn.effectiveType.toUpperCase() : 'ONLINE';
    }
    tick(); const clockT = setInterval(tick, 20000);
    on(window, 'online', tick); on(window, 'offline', tick);
    if (navigator.getBattery) navigator.getBattery().then(b => { const u = () => { if (!dead) q('.np-batf').style.width = Math.round(b.level * 100) + '%'; }; u(); b.addEventListener('levelchange', u); }).catch(() => { });

    // ---------- media session ----------
    function setMedia() {
        if (!('mediaSession' in navigator)) return;
        const ep = c.curEp();
        try { navigator.mediaSession.metadata = new MediaMetadata({ title: c.title() + (ep ? ` · Ep ${ep.number}` : ''), artist: 'NauMovie', artwork: c.poster() ? [{ src: c.poster() }] : [] }); } catch (e) { }
        const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) { } };
        h('play', togglePlay); h('pause', togglePlay); h('seekbackward', () => skip(-10)); h('seekforward', () => skip(10));
        h('nexttrack', nextEp() ? () => act('next') : null);
        h('enterpictureinpicture', () => { if (!pipOn()) pip(); }); // PiP otomatis saat pindah tab / aplikasi (browser yang mendukung)
    }

    // ---------- sinkron dengan film (dipanggil saat ganti episode/kualitas) ----------
    function paintMark() { q('.np-markf').classList.toggle('np-on', !!c.isSaved()); }
    function refresh(reset) {
        const ep = c.curEp();
        q('.np-fstitle').textContent = c.title() + (ep ? ` (S${ep.season} E${ep.number})` : '');
        q('.np-epbtn').style.display = c.eps().length > 1 ? '' : 'none';
        q('.np-nxb').style.display = c.eps().length > 1 ? '' : 'none';
        paintQ(); paintMark(); setMedia();
        if (reset) {
            cancelNext(); q('.np-err').classList.remove('np-on');
            root.classList.remove('np-started'); root.dataset.playing = '0';
            q('.np-poster').style.backgroundImage = c.poster() ? `url("${c.poster()}")` : '';
        }
    }
    function destroy() {
        if (dead) return; dead = true;
        off.forEach(f => f()); off.length = 0;
        clearInterval(clockT); clearTimeout(hideT); clearTimeout(toastT); clearTimeout(hudT); clearTimeout(nextCd); clearTimeout(sleepT); clearTimeout(tapT);
        if (g) clearTimeout(g.lp);
        try { if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { }
        try { screen.orientation.unlock(); } catch (e) { }
        if (film) film.style.overflowY = '';
        if ('mediaSession' in navigator) ['play', 'pause', 'seekbackward', 'seekforward', 'nexttrack'].forEach(a => { try { navigator.mediaSession.setActionHandler(a, null); } catch (e) { } });
    }

    // posisi menempel di bawah header film
    const bar = film && film.querySelector('.fbar');
    if (bar) root.style.setProperty('--np-top', bar.offsetHeight + 'px');
    refresh(false); applyLayout();
    if (!c.curUrl()) showErr('Sumber video belum tersedia');
    show();
    return { refresh, destroy, paintMark, showErr, toast };
}

// ---- suara peer-to-peer (WebRTC mesh, signaling lewat Supabase Realtime) ----
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

const voiceUI = () => `<div class="voice"><div class="vtop"><b>${ic('headset')} Obrolan suara</b><span id="vst">Mati</span></div><div class="vlist" id="vlist"></div><div class="vbtns"><button class="btn sm" id="vjoin">${ic('mic')} Gabung suara</button><button class="btn sm ghost" id="vmute" hidden>${ic('micoff')} Mute</button><button class="btn sm ghost" id="vdeaf" hidden>${ic('headset')} Deafen</button></div><p class="hint" id="vhint2" hidden>Ketuk nama teman untuk membisukan dia (hanya di telingamu).</p></div>`;

function applyAudio() {
    if (!vc) return;
    Object.entries(vc.peers).forEach(([id, p]) => { if (p.el) p.el.muted = !!(vc.deaf || vc.loc[id]); });
}

function initVoice() {
    $('#vjoin').onclick = () => vc ? leaveVoice() : joinVoice();
    $('#vmute').onclick = () => {
        if (!vc) return;
        vc.muted = !vc.muted;
        vc.stream.getAudioTracks().forEach(t => t.enabled = !vc.muted);
        drawVoice();
    };
    // deafen: suara orang lain dibisukan di perangkatmu saja, mic-mu tetap jalan
    $('#vdeaf').onclick = () => { if (!vc) return; vc.deaf = !vc.deaf; applyAudio(); drawVoice(); };
    $('#vlist').onclick = e => {
        const b = e.target.closest('[data-id]');
        if (!b || !vc) return;
        vc.loc[b.dataset.id] = !vc.loc[b.dataset.id];
        applyAudio(); drawVoice();
    };
}

function drawVoice() {
    const st = $('#vst');
    if (!st) return;
    const ids = vc ? Object.keys(vc.peers) : [];
    st.textContent = vc ? `Terhubung · ${ids.length + 1} orang` : 'Mati';
    $('#vjoin').innerHTML = vc ? 'Keluar suara' : `${ic('mic')} Gabung suara`;
    $('#vmute').hidden = $('#vdeaf').hidden = $('#vhint2').hidden = !vc;
    if (vc) {
        $('#vmute').innerHTML = vc.muted ? `${ic('mic')} Nyalakan mic` : `${ic('micoff')} Mute mic`;
        $('#vmute').classList.toggle('hot', vc.muted);
        $('#vdeaf').innerHTML = vc.deaf ? `${ic('headset')} Dengar lagi` : `${ic('headset')} Deafen`;
        $('#vdeaf').classList.toggle('hot', vc.deaf);
    }
    $('#vlist').innerHTML = vc ? [`<span class="vchip on">${esc(me.username)}${vc.muted ? ' · mic mati' : ''}${vc.deaf ? ' · deaf' : ''}</span>`,
        ...ids.map(i => `<button class="vchip ${vc.peers[i].pc.connectionState === 'connected' ? 'on' : ''} ${vc.loc[i] ? 'off' : ''}" data-id="${i}">${esc(vc.names[i] || 'Teman')}${vc.loc[i] ? ' · dibisukan' : ''}</button>`)].join('') : '';
}

async function joinVoice() {
    if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection)
        return toast('Browser ini belum mendukung suara');
    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
        return toast('Izin mikrofon ditolak');
    }
    if (!room) {
        stream.getTracks().forEach(t => t.stop());
        return;
    }
    const ch = sb.channel('vc' + room.code, { config: { broadcast: { self: false } } });
    vc = { stream, ch, peers: {}, names: {}, muted: false, deaf: false, loc: {} };
    vc.send = (type, to, data) => ch.send({ type: 'broadcast', event: 'sig', payload: { type, from: me.id, to, name: me.username, data } });
    ch.on('broadcast', { event: 'sig' }, ({ payload }) => onSig(payload).catch(() => { }));
    ch.subscribe(st => {
        if (st === 'SUBSCRIBED')
            vc?.send('hello', null);
    });
    drawVoice();
}

function closePeer(id) {
    const p = vc?.peers[id];
    if (!p)
        return;
    delete vc.peers[id];
    p.pc.close();
    if (p.el) {
        p.el.srcObject = null;
    }
    drawVoice();
}

function makePeer(id, init) {
    const pc = new RTCPeerConnection(ICE), p = { pc, q: [], el: null };
    vc.peers[id] = p;
    vc.stream.getTracks().forEach(t => pc.addTrack(t, vc.stream));
    pc.onicecandidate = e => e.candidate && vc?.send('ice', id, e.candidate.toJSON());
    pc.ontrack = e => {
        p.el = p.el || new Audio();
        p.el.autoplay = true;
        p.el.muted = !!(vc && (vc.deaf || vc.loc[id]));
        p.el.srcObject = e.streams[0];
        p.el.play().catch(() => { });
        drawVoice();
    };
    pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed')
            closePeer(id);
        else
            drawVoice();
    };
    if (init)
        pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => vc?.send('offer', id, pc.localDescription));
    drawVoice();
    return p;
}

async function onSig(m) {
    if (!vc || m.from === me.id || (m.to && m.to !== me.id))
        return;
    vc.names[m.from] = m.name;
    const t = m.type;
    if (t === 'hello' || t === 'hi') {
        if (t === 'hello') {
            closePeer(m.from);
            vc.send('hi', m.from);
        }
        // satu sisi saja yang jadi penawar supaya tidak bentrok
        if (!vc.peers[m.from] && me.id > m.from)
            makePeer(m.from, true);
    } else if (t === 'offer') {
        closePeer(m.from);
        const p = makePeer(m.from, false);
        await p.pc.setRemoteDescription(m.data);
        for (const c of p.q.splice(0))
            await p.pc.addIceCandidate(c).catch(() => { });
        const a = await p.pc.createAnswer();
        await p.pc.setLocalDescription(a);
        vc.send('answer', m.from, p.pc.localDescription);
    } else if (t === 'answer') {
        const p = vc.peers[m.from];
        if (!p)
            return;
        await p.pc.setRemoteDescription(m.data);
        for (const c of p.q.splice(0))
            await p.pc.addIceCandidate(c).catch(() => { });
    } else if (t === 'ice') {
        const p = vc.peers[m.from];
        if (!p)
            return;
        p.pc.remoteDescription ? p.pc.addIceCandidate(m.data).catch(() => { }) : p.q.push(m.data);
    } else if (t === 'bye') {
        closePeer(m.from);
    }
}

function leaveVoice() {
    if (!vc)
        return;
    const v = vc;
    v.send('bye', null);
    Object.keys(v.peers).forEach(closePeer);
    v.stream.getTracks().forEach(t => t.stop());
    setTimeout(() => sb.removeChannel(v.ch), 300);
    vc = null;
    drawVoice();
}

    const unsay = () => { sayEl.getAnimations().forEach(a => a.pause()); sayEl.animate([{ opacity: 1, transform: 'translate(-50%,0)' }, { opacity: 0, transform: 'translate(-50%,-12px) scale(.7)' }], { duration: 150, fill: 'forwards' }); };

            a.finish();

function resizeSquare(file, size = 256) {
    return new Promise((ok, fail) => {
        const img = new Image();
        img.onload = () => {
            const s = Math.min(img.width, img.height), cv = document.createElement('canvas');
            cv.width = cv.height = size;
            cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
            cv.toBlob(b => b ? ok(b) : fail(new Error('Gagal memproses gambar')), 'image/jpeg', .88);
        };
        img.onerror = () => fail(new Error('File bukan gambar'));
        img.src = URL.createObjectURL(file);
    });
}

async function uploadAvatar(input) {
    const f = input.files[0];
    if (!f)
        return;
    try {
        toast('Mengupload...');
        const blob = await resizeSquare(f), path = `${me.id}/${Date.now()}.jpg`;
        const { error } = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' });
        if (error)
            throw error;
        await setAvatar(sb.storage.from('avatars').getPublicUrl(path).data.publicUrl);
    } catch (e) {
        toast(e.message);
    }
    input.value = '';
}

// voice
async function startRec() {
    if (rec)
        return;
    if (!navigator.mediaDevices || !window.MediaRecorder)
        return toast('Browser ini belum mendukung rekam suara');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(m => MediaRecorder.isTypeSupported(m)) || '';
        rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        recChunks = [];
        rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
        rec.start();
        recT0 = Date.now();
        $('#rec').hidden = false;
        $('#cmp').hidden = true;
        recTimer = setInterval(() => {
            const s = (Date.now() - recT0) / 1000;
            $('#rtime').textContent = fmtT(s);
            if (s >= 60)
                stopRec(true);
        }, 250);
    } catch (e) {
        rec = null;
        toast('Izinkan akses mikrofon dulu ya');
    }
}

function stopRec(send) {
    if (!rec)
        return;
    const r = rec, dur = (Date.now() - recT0) / 1000;
    rec = null;
    clearInterval(recTimer);
    const rb = $('#rec'), cb = $('#cmp');
    if (rb)
        rb.hidden = true;
    if (cb)
        cb.hidden = false;
    r.onstop = async () => {
        r.stream.getTracks().forEach(t => t.stop());
        if (!send)
            return;
        if (dur < 1)
            return toast('Terlalu pendek, tahan sedikit lebih lama');
        const type = (r.mimeType || 'audio/webm').split(';')[0];
        const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
        const path = `${me.id}/${Date.now()}.${ext}`;
        toast('Mengirim suara...');
        const { error } = await sb.storage.from('voice').upload(path, new Blob(recChunks, { type }), { contentType: type });
        if (error)
            return toast(error.message);
        sendMsg({ kind: 'voice', msg: '', media_url: sb.storage.from('voice').getPublicUrl(path).data.publicUrl, duration: dur });
    };
    r.state !== 'inactive' ? r.stop() : r.onstop();
}

function cancelRec() {
    stopRec(false);
    stopVoice();
}

function stopVoice() {
    if (voiceAudio) {
        voiceAudio.pause();
        voiceAudio = null;
    }
    if (voiceBtn) {
        voiceBtn.classList.remove('playing');
        voiceBtn.querySelector('.vi').innerHTML = ic('play');
        voiceBtn = null;
    }
}

function toggleVoice(btn) {
    const was = voiceBtn === btn;
    stopVoice();
    if (was)
        return;
    voiceBtn = btn;
    voiceAudio = new Audio(btn.dataset.src);
    btn.classList.add('playing');
    btn.querySelector('.vi').innerHTML = ic('pause');
    voiceAudio.onended = stopVoice;
    voiceAudio.onerror = () => {
        stopVoice();
        toast('Gagal memutar suara');
    };
    voiceAudio.play().catch(stopVoice);
}

    const seen = new Set(), out = [];
    (Array.isArray(list) ? list : []).forEach(s => {
        const url = String((s && (s.url || s.link || s.src)) || '').trim();
        if (!okUrl(url) || seen.has(url)) return;
        seen.add(url);
        out.push({ res: String((s && (s.res || s.resolution || s.quality)) || '').trim() || 'Auto', url });
    });
    return out.sort((a, b) => resNum(a.res) - resNum(b.res));
}

// pilih sumber terbaik: resolusi tertinggi yang <= batas (HP: 720p, layar besar: 1080p) atau pilihan user
function pickSrc(it, limit) {
    let s = it && Array.isArray(it.sources) && it.sources.length ? it.sources : (it && it.video_url ? [{ res: 'Auto', url: it.video_url }] : []);
    if (!s.length) return null;
    const pref = localStorage.nm_res || 'auto';
    const lim = limit || (pref === 'auto' ? (innerWidth <= 600 ? 720 : 1080) : +pref || 1080);
    const known = [...s].filter(x => resNum(x.res)).sort((a, b) => resNum(a.res) - resNum(b.res));
    if (!known.length) return s[0];
    const ok = known.filter(x => resNum(x.res) <= lim);
    return ok.length ? ok[ok.length - 1] : known[0];
}

// ---- judul ----
// judul dari nama file: "Spider-Man.No.Way.Home.2021.1080p.WEB-DL.mp4" -> "Spider Man No Way Home"
const guessTitle = u => {
    let n = '';
    try { n = decodeURIComponent(String(u).split('?')[0].split('#')[0].split('/').pop()); } catch (e) { n = String(u).split('/').pop(); }
    return n.replace(/\.[a-z0-9]{2,4}$/i, '').replace(/[._]+/g, ' ')
        .replace(/\b(2160p|1080p|720p|480p|360p|web-?dl|webrip|blu-?ray|brrip|hdrip|hdtv|x26[45]|hevc|aac|dubbed|indo|nonton)\b/gi, ' ')
        .replace(/[\(\[]\s*(19|20)\d\d\s*[\)\]]/g, ' ').replace(/\b(19|20)\d\d\b/g, ' ').replace(/-+/g, ' ').replace(/\s+/g, ' ').trim()
        .replace(/\b\w/g, c => c.toUpperCase());
};

// "Tusk (2014)" -> {title:'Tusk', year:2014}; "Caustico 2023" -> {title:'Caustico', year:2023}
function splitTitle(raw) {
    let t = String(raw || '').trim(), year = null, m = t.match(/\s*\(((?:19|20)\d\d)\)\s*$/);
    const max = new Date().getFullYear() + 1;
    if (m) { year = +m[1]; t = t.slice(0, m.index).trim(); }
    else if ((m = t.match(/^(.*\S)\s+((?:19|20)\d\d)$/)) && +m[2] <= max) { year = +m[2]; t = m[1]; }
    return { title: t || String(raw || '').trim(), year };
}

// kata kunci pencarian TMDB: buang "Season 2" dsb
const tmdbQuery = t => String(t || '').replace(/\s*[-–:]?\s*(season|musim|s)\s*\d+\s*$/i, '').replace(/\s+/g, ' ').trim();

// terima banyak format kunci (title/judul/name, url/link/video, poster/thumbnail, ...) + format katalog (sources[], episodes[])
function normItem(x) {
    if (typeof x === 'string') x = { video_url: x };
    if (!x || typeof x !== 'object') return null;
    const pk = (...k) => { for (const n of k) if (x[n] != null && x[n] !== '') return x[n]; return null; };
    const one = (u, res) => okUrl(u) ? [{ res: String(res || 'Auto'), url: String(u).trim() }] : [];

    let sources = cleanSources(x.sources);
    if (!sources.length) sources = one(pk('video_url', 'video', 'url', 'link', 'src', 'file', 'stream'), pk('res', 'resolution', 'quality'));

    const rawEps = pk('episodes', 'eps');
    let episodes = (Array.isArray(rawEps) ? rawEps : []).map((e, k) => {
        if (!e || typeof e !== 'object') return null;
        const list = cleanSources(e.sources), src = list.length ? list : one(e.video_url || e.url || e.link || e.video, e.res);
        if (!src.length) return null;
        const th = e.thumbnail_url || e.thumbnail || e.thumb, nm = e.name || e.title || e.judul;
        return {
            season: +(e.season || e.musim) || 1,
            number: +(e.number || e.no || e.episode || e.ep) || k + 1,
            name: nm != null && nm !== '' ? String(nm).slice(0, 200) : null,
            thumb: okUrl(th) ? String(th).trim() : null,
            sources: src
        };
    }).filter(Boolean);

    const t0 = pk('title', 'judul', 'name', 'nama', 'original_title');
    const anyUrl = (sources[0] || (episodes[0] && episodes[0].sources[0]) || {}).url;
    const sp = splitTitle(String(t0 || (anyUrl && guessTitle(anyUrl)) || '').trim());

    let th = pk('thumbnail_url', 'thumbnail', 'poster', 'poster_url', 'image', 'cover', 'img', 'poster_path');
    if (th && /^\/[\w-]+\.(jpg|png|webp)$/i.test(th)) th = 'https://image.tmdb.org/t/p/w500' + th;
    if (th && !okUrl(th)) th = null;

    let g = pk('genre', 'genres', 'kategori');
    if (Array.isArray(g)) g = g.map(i => (i && i.name) || i).filter(i => typeof i === 'string').join(', ');

    const dt = pk('year', 'tahun', 'release_date', 'first_air_date');
    let year = dt ? +String(dt).slice(0, 4) || null : sp.year;
    if (!year && !t0 && anyUrl) { const m = anyUrl.match(/\b(19|20)\d\d\b/); if (m) year = +m[0]; }

    // 2+ episode = series. Film yang disimpan sebagai 1 episode dijadikan film biasa.
    const ty = String(pk('type', 'jenis', 'media_type') || '');
    const isSeries = /series|tv|serial/i.test(ty) || episodes.length > 1;
    let fallbackThumb = null;
    if (!isSeries && episodes.length) {
        if (!sources.length) sources = episodes[0].sources;
        fallbackThumb = episodes[0].thumb;
        episodes = [];
    }
    if (isSeries && episodes.length) sources = []; // link ada di tiap episode

    const ca = pk('created_at'), cat = pk('category');
    return {
        title: sp.title, guessed: !t0, year, genre: g || null,
        category: cat ? String(cat).toLowerCase().trim().slice(0, 30) : null,
        type: isSeries ? 'series' : 'movie',
        description: pk('description', 'deskripsi', 'overview', 'synopsis', 'sinopsis', 'plot'),
        sources, episodes, thumbnail_url: th || null, fallbackThumb, tmdb_id: null,
        created_at: ca && !isNaN(Date.parse(ca)) ? new Date(ca).toISOString() : null,
        video_url: sources.length ? pickSrc({ sources }, 1080).url : null
    };
}

const validRow = r => !!(r && r.title && (r.sources.length || r.episodes.length));

// daftar judul dari berbagai bentuk JSON (katalog export punya kunci "films")
const toArr = j => Array.isArray(j) ? j : j && (j.films || j.data || j.results || j.movies || j.items || j.titles || Object.values(j).find(Array.isArray));

const isDup = (list, r) => list.some(t => t.title.toLowerCase() === r.title.toLowerCase() && (!t.year || !r.year || t.year === r.year));

// ---- TMDB (poster otomatis) ----
const normStr = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

const tmdbNames = r => [r.title, ...(r.alts || [])].filter(Boolean);
const jac = (a, b) => { const x = new Set(a.split(' ').filter(Boolean)), y = new Set(b.split(' ').filter(Boolean)); if (!x.size || !y.size) return 0; let i = 0; x.forEach(w => { if (y.has(w)) i++; }); return i / (x.size + y.size - i); };

function bestMatch(list, r) {
    const qs = tmdbNames(r).map(n => normStr(tmdbQuery(n))), want = r.type === 'series' ? 'tv' : 'movie';
    let best = null, bs = 0;
    (list || []).forEach(m => {
        const mt = normStr(m.title), ty = m.media_type === want, yr = !!(r.year && +m.year === r.year), eq = qs.includes(mt);
        const sim = Math.max(0, ...qs.map(q => jac(q, mt)));
        const s = (ty ? 4 : 0) + (yr ? 3 : (r.year && Math.abs(+m.year - r.year) === 1 ? 1 : 0)) + (eq ? 3 : 0) + sim * 3 + (m.poster ? 3 : 0);
        if ((eq || sim >= .25 || (yr && ty)) && (ty || yr || eq) && s > bs) { best = m; bs = s; }
    });
    return best;
}

// variasi judul: apa adanya, "&" jadi "and", tanpa subjudul setelah ":" / "-", tanpa tanda baca
const tmdbVariants = t => {
    const b = tmdbQuery(t);
    return [...new Set([b, b.replace(/&/g, ' and '), b.split(/\s*[:\-–]\s*/)[0], b.replace(/[^\p{L}\p{N}\s]/gu, ' ')].map(x => x.replace(/\s+/g, ' ').trim()).filter(x => x.length >= 2))];
};

async function tmdbFind(r) {
    const qs = [...new Set(tmdbNames(r).flatMap(tmdbVariants))];
    for (const q of qs) {
        for (let a = 0; a < 2; a++) {
            try {
                const { data, error } = await sb.functions.invoke('hub', { body: { action: 'tmdb', q } });
                if (error || !data || data.error) throw new Error('tmdb');
                const m = bestMatch(data.results, r);
                if (m) return m;
                break;
            } catch (e) { await new Promise(res => setTimeout(res, 600)); }
        }
    }
    return null;
}

const tidyText = s => {
    s = String(s || '').trim();
    if (s.length < 270) return s;
    const i = Math.max(s.lastIndexOf('. '), s.lastIndexOf('! '), s.lastIndexOf('? '));
    if (i > 80) return s.slice(0, i + 1);
    const cut = s.replace(/\s+\S*$/, '');
    return (cut.length > 80 && cut.length < s.length ? cut : s.slice(0, 277)) + '…';
};

function applyTmdb(r, m) {
    if (!m) return false;
    r.tmdb_id = m.id;
    if (r.guessed && m.title) r.title = m.title;
    r.thumbnail_url = r.thumbnail_url || (m.poster ? m.poster.replace('/w342/', '/w500/') : null);
    r.description = r.description || tidyText(m.overview) || null;
    r.genre = r.genre || m.genres || null;
    r.year = r.year || +m.year || null;
    return !!m.poster;
}

// jalankan fn untuk tiap item, maksimal n sekaligus
async function pool(items, n, fn) {
    let i = 0;
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
        while (i < items.length) { const k = i++; await fn(items[k], k); }
    }));
}

// ---- proses import ----
let impReport = '', impOk = false, impPre = '', impBack = 'imp';

function prog(p, msg) {
    const el = $('#imp_prog');
    if (!el) return;
    el.hidden = false;
    el.innerHTML = `<b>Sedang import…</b><div class="bar"><i style="width:${Math.round(Math.min(1, p) * 100)}%"></i></div><p class="hint">${esc(msg)}</p>`;
}

async function refreshTitles() {
    const { data } = await sb.from('titles').select('*').order('created_at', { ascending: false });
    titles = data || [];
}

async function impDone(o, msg) {
    impOk = true;
    if (o.onOk) { try { await o.onOk(); } catch (e) { } }
    return finishImport(msg);
}

async function finishImport(msg) {
    if (impPre) { msg = impPre + msg; impPre = ''; }
    impReport = msg;
    await refreshTitles();
    const back = impBack; impBack = 'imp';
    if (tab === 'admin') await views.admin(back);
    toast(msg.split('\n')[0]);
}

async function runImport(rows, o = {}) {
    impOk = false;
    const fresh = [], dups = [];
    rows.forEach(r => (isDup(titles, r) || isDup(fresh, r) ? dups : fresh).push(r));
    if (!fresh.length) return impDone(o, 'Semua judul sudah ada di katalog, tidak ada yang ditambahkan.');

    let poster = 0, n = 0;
    if (o.tmdb !== false) {
        await pool(fresh, 3, async r => {
            if (applyTmdb(r, await tmdbFind(r))) poster++;
            prog(.05 + (++n / fresh.length) * .55, `Mencari poster TMDB ${n}/${fresh.length} · ${r.title}`);
        });
    }

    let nTitle = 0, nSeries = 0, nEp = 0;
    const t0 = Date.now();
    try {
        for (let i = 0; i < fresh.length; i += 40) {
            const chunk = fresh.slice(i, i + 40);
            prog(.6 + (i / fresh.length) * .38, `Menyimpan judul ${i + 1}-${i + chunk.length} dari ${fresh.length}`);
            const { data, error } = await sb.from('titles').insert(chunk.map((r, k) => ({
                title: r.title, type: r.type, category: r.category, year: r.year, genre: r.genre, description: r.description,
                video_url: r.video_url, sources: r.sources.length ? r.sources : null, tmdb_id: r.tmdb_id,
                thumbnail_url: r.thumbnail_url || r.fallbackThumb || null,
                created_at: r.created_at || new Date(t0 + i + k).toISOString(), created_by: me.id
            }))).select('id,title');
            if (error) throw error;
            if (!data || data.length !== chunk.length) throw new Error('Hasil simpan tidak lengkap');

            const eps = [];
            chunk.forEach((r, k) => r.episodes.forEach(e => eps.push({
                title_id: data[k].id, season: e.season, number: e.number, name: e.name,
                video_url: pickSrc({ sources: e.sources }, 1080).url, thumbnail_url: e.thumb, sources: e.sources
            })));
            if (eps.length) {
                const r2 = await sb.from('episodes').insert(eps);
                if (r2.error) { // batalkan judul batch ini supaya tidak ada series tanpa episode
                    await sb.from('titles').delete().in('id', data.map(d => d.id));
                    throw r2.error;
                }
            }
            nTitle += chunk.length;
            nSeries += chunk.filter(r => r.type === 'series').length;
            nEp += eps.length;
        }
    } catch (e) {
        return finishImport(`Import berhenti: ${e.message}\n${nTitle} judul sempat masuk. Jalankan lagi, judul yang sudah ada otomatis dilewati.`);
    }

    const bits = [`${nTitle} judul masuk (${nTitle - nSeries} film, ${nSeries} series, ${nEp} episode)`];
    if (o.tmdb !== false) bits.push(`${poster} poster dari TMDB${poster < nTitle ? `, ${nTitle - poster} pakai gambar bawaan / kosong` : ''}`);
    if (dups.length) bits.push(`${dups.length} dilewati karena sudah ada: ${dups.slice(0, 8).map(r => r.title).join(', ')}${dups.length > 8 ? '…' : ''}`);
    return impDone(o, bits.join('\n'));
}

async function bulk(j) {
    const arr = toArr(j);
    if (!Array.isArray(arr)) return toast('Format JSON tidak dikenali (harus berupa array / ada kunci "films")');
    const rows = arr.map(normItem).filter(validRow);
    if (!rows.length) return toast('Tidak ada item valid. Minimal ada judul dan link video');
    await runImport(rows);
}

// ---- import katalog: pilih file -> ringkasan -> mulai ----
let catRows = [];

async function catPick(inp) {
    const f = inp.files[0], box = $('#cat_prev');
    catRows = [];
    if (!f) { box.innerHTML = ''; return; }
    let j;
    try { j = JSON.parse(await f.text()); } catch (e) { box.innerHTML = ''; return toast('File bukan JSON yang valid'); }
    const arr = toArr(j);
    if (!Array.isArray(arr)) { box.innerHTML = ''; return toast('Format katalog tidak dikenali (butuh daftar "films")'); }
    const rows = [], bad = [];
    arr.forEach(x => { const r = normItem(x); if (validRow(r)) rows.push(r); else bad.push((x && (x.title || x.judul || x.name)) || '(tanpa judul)'); });
    catRows = rows;
    if (!rows.length) { box.innerHTML = '<p class="hint">Tidak ada judul yang punya link video.</p>'; return; }

    const maxRes = r => Math.max(0, ...r.sources.map(s => resNum(s.res)), ...r.episodes.flatMap(e => e.sources.map(s => resNum(s.res))));
    const count = a => a.reduce((m, k) => (k && (m[k] = (m[k] || 0) + 1), m), {});
    const pills = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="pill">${esc(k)} × ${v}</span>`).join('');
    const dup = rows.filter(r => isDup(titles, r)).length;

    box.innerHTML = `<div class="impsum"><p><b>${rows.length}</b> judul terbaca · ${rows.length - nS} film · ${nS} series · ${nE} episode</p>
<p class="hint">Kategori</p><div>${pills(count(rows.map(r => r.category || (r.type === 'series' ? 'series' : 'film'))))}</div>
<p class="hint">Resolusi tertinggi</p><div>${pills(count(rows.map(r => maxRes(r) ? maxRes(r) + 'p' : 'Auto')))}</div>
${dup ? `<p class="hint">${dup} judul sudah ada di katalog dan akan dilewati.</p>` : ''}${bad.length ? `<p class="hint">${bad.length} item tanpa link video diabaikan: ${esc(bad.slice(0, 5).join(', '))}${bad.length > 5 ? '…' : ''}</p>` : ''}${extra ? '<p class="hint">Data akun, riwayat, dan pengaturan di file ini tidak ikut diimpor (hanya katalog).</p>' : ''}</div>
<div class="implist">${rows.slice(0, 60).map(r => `<div class="impit"><b>${esc(r.title)}</b><small>${[r.year, r.type === 'series' ? r.episodes.length + ' eps' : '', maxRes(r) ? maxRes(r) + 'p' : '', r.category ? esc(r.category) : (r.type === 'series' ? '' : 'film'), isDup(titles, r) ? 'sudah ada' : ''].filter(Boolean).join(' · ')}</small></div>`).join('')}${rows.length > 60 ? `<p class="hint">…dan ${rows.length - 60} lainnya</p>` : ''}</div>
<div class="srow"><span>Cari poster otomatis (TMDB)<small>Poster, sinopsis, genre, dan tahun diisi dari TMDB</small></span><button class="sw on" id="cat_tm" role="switch" aria-checked="true" onclick="this.classList.toggle('on');this.setAttribute('aria-checked',this.classList.contains('on'))"></button></div>
<button class="btn glow" id="cat_go" style="width:100%" onclick="catRun()">Mulai import</button>`;
}

async function catRun() {
    if (!catRows.length) return toast('Pilih file katalog dulu');
    const b = $('#cat_go'), s = $('#cat_tm');
    if (b) b.disabled = true;
    const rows = catRows, tm = !s || s.classList.contains('on');
    catRows = [];
    prog(.02, 'Menyiapkan…');
    await runImport(rows, { tmdb: tm });
}

// poster untuk judul lama yang masih kosong
async function tmdbBackfill() {
    const miss = titles.filter(t => !t.thumbnail_url);
    if (!miss.length) return toast('Semua judul sudah punya poster');
    if (!confirm(`Cari poster TMDB untuk ${miss.length} judul yang masih kosong?`)) return;
    let ok = 0, n = 0;
    await pool(miss, 3, async t => {
        const m = await tmdbFind({ title: t.title, year: t.year, type: t.type });
        if (m && m.poster) {
            const { error } = await sb.from('titles').update({
                thumbnail_url: m.poster.replace('/w342/', '/w500/'), tmdb_id: m.id,
                description: t.description || tidyText(m.overview) || null, genre: t.genre || m.genres || null, year: t.year || +m.year || null
            }).eq('id', t.id);
            if (!error) ok++;
        }
        prog(++n / miss.length, `Mencari poster ${n}/${miss.length} · ${t.title}`);
    });
    await finishImport(`${ok} dari ${miss.length} judul dapat poster dari TMDB${ok < miss.length ? ` (${miss.length - ok} tidak ketemu, bisa diisi manual)` : ''}`);
}

const impTab = () => `<div class="glass pad"><b>Import katalog (.json)</b><p class="hint">Pilih file katalog. Nama, kategori, resolusi, dan episode ikut terbaca. Kamu bisa cek ringkasannya dulu sebelum mulai.</p><input id="cat_f" type="file" accept=".json,application/json" onchange="catPick(this)"><div id="cat_prev"></div></div>

        ? `<p class="hint"><b>${jqFiles.length}</b> file dipilih · <a href="#" onclick="jqClear();return false">kosongkan</a></p><div class="implist">${jqFiles.map((f, i) => `<div class="impit"><b>${esc(f.name)}</b><small>${Math.max(1, Math.round(f.size / 1024))} KB · <a href="#" onclick="jqRemove(${i});return false">hapus</a></small></div>`).join('')}</div>`
        : '';
}

const jqMissing = e => !!e && (e.code === '42P01' || e.code === 'PGRST205' || /does not exist|schema cache|json_queue/i.test(e.message || ''));

// satu file bisa: 1 objek episode, array episode, atau objek berisi array (data / episodes / ...)
function jqRecords(j) {
    const isRec = o => !!o && typeof o === 'object' && !Array.isArray(o) && (Array.isArray(o.qualities) || !!o.source_quality);
    if (isRec(j)) return [j];
    if (j && isRec(j.data)) return [j.data];
    const arr = toArr(j);
    return Array.isArray(arr) ? arr.filter(isRec) : [];
}

// resolusi otomatis: 144p, 240p, 540p, 720p ... sampai resolusi tertinggi yang ada di JSON
function jqLadder(list, on) {
    const seen = new Set(), real = [];
    list.forEach(s => {
        const url = String((s && s.url) || '').trim();
        if (!okUrl(url) || seen.has(url)) return;
        seen.add(url);
        const n = resNum(s.res);
        real.push({ res: n ? n + 'p' : String(s.res || 'Auto'), url });
    });
    const asc = (a, b) => resNum(a.res) - resNum(b.res);
    const nums = real.filter(s => resNum(s.res)).sort(asc);
    if (!on || !nums.length) return real.sort(asc);
    const max = resNum(nums[nums.length - 1].res), out = [...real];
    JQ_LADDER.filter(r => r <= max && !nums.some(s => resNum(s.res) === r)).forEach(r => {
        const base = nums.find(s => resNum(s.res) >= r) || nums[nums.length - 1];
        out.push({ res: r + 'p', url: base.url + '#q' + r + 'p' }); // fragmen #qXXXp tidak mengubah file, hanya supaya tiap pilihan kualitas punya link unik
    });
    return out.sort(asc);
}

// nama folder di link (".../Deadpool-Wolverine-2024/xxx.mp4") = nama alternatif + tahun untuk pencarian poster
function jqFolder(u) {
    try {
        const seg = decodeURIComponent(new URL(u).pathname).split('/').filter(Boolean);
        const f = (seg.length > 1 ? seg[seg.length - 2] : '').replace(/[._-]+/g, ' ').trim();
        const y = (f.match(/\b(19|20)\d{2}\b/) || [])[0];
        const name = f.replace(/\b(19|20)\d{2}\b/g, '').replace(/\b(film|movie|anime|series)\d*\b/gi, '').replace(/\s+/g, ' ').trim();
        return { name: name.length >= 3 ? name : '', year: y ? +y : null };
    } catch (e) { return { name: '', year: null }; }
}

// kategori otomatis: field kategori di JSON > petunjuk di link (folder film/anime) > jumlah episode
function jqCategory(g, series) {
    const hint = String(g.hint || '').toLowerCase();
    if (/anime|donghua|aniplay/.test(hint)) return 'anime';
    if (/film|movie|bioskop/.test(hint)) return 'film';
    const path = g.urls.map(u => { try { return decodeURIComponent(new URL(u).pathname); } catch (e) { return u; } }).join(' ').toLowerCase();
    if (/\/(anime|donghua)/.test(path)) return 'anime';
    if (/\/(film|movie|movies)\d*(\/|$)/.test(path)) return 'film';
    return series ? 'anime' : 'film';
}

function jqBuild(records, o) {
    const groups = new Map();
    records.forEach(x => {
        const an = x.anime || {};
        const src = (Array.isArray(x.qualities) ? x.qualities : []).map(q => ({ res: q && q.nama_quality, url: q && q.source_quality }));
        if (!src.length && x.source_quality) src.push({ res: x.nama_quality, url: x.source_quality });
        const sources = jqLadder(src, o.ladder);
        if (!sources.length) return;
        const raw = String(an.nama_anime || x.anime_title || x.nama_anime || '').trim() || guessTitle(src.find(s => okUrl(s.url)).url);
        const key = x.anime_id != null ? 'id:' + x.anime_id : 'n:' + raw.toLowerCase();
        let g = groups.get(key);
        if (!g) groups.set(key, g = { raw, cover: okUrl(an.gambar_anime) ? String(an.gambar_anime).trim() : null, eps: [], urls: [], hint: '' });
        g.urls.push(...src.map(q => String(q.url || '')).filter(okUrl));
        g.hint = g.hint || x.category || x.kategori || an.category || an.kategori || an.tipe || an.type || '';
        const th = x.thumbnail_episode;
        g.eps.push({
            season: 1,
            number: +x.nomor_episode || g.eps.length + 1,
            name: x.judul_episode ? String(x.judul_episode).slice(0, 200) : null,
            thumb: okUrl(th) ? String(th).trim() : null,
            sources
        });
    });
    return [...groups.values()].map(g => {
        const seen = new Set();
        const eps = g.eps.filter(e => { const k = e.season + '-' + e.number; if (seen.has(k)) return false; seen.add(k); return true; }).sort((a, b) => a.number - b.number);
        const series = eps.length > 1, sp = splitTitle(g.raw);
        return {
            title: sp.title, guessed: false, year: sp.year || jqFolder(g.urls[0]).year, genre: null, category: jqCategory(g, series),
            type: series ? 'series' : 'movie', description: null,
            sources: series ? [] : eps[0].sources, episodes: series ? eps : [], _eps: eps,
            thumbnail_url: g.cover || (o.tmdb === false && eps[0].thumb ? eps[0].thumb + '#frame' : null), // frame video bukan poster: dipakai hanya bila TMDB tidak menemukan
            fallbackThumb: g.cover ? null : (eps[0].thumb ? eps[0].thumb + '#frame' : null),
            alts: (() => { const f = jqFolder(g.urls[0]); return f.name && f.name.toLowerCase() !== sp.title.toLowerCase() ? [f.name] : []; })(),
            tmdb_id: null, created_at: null,
            video_url: series ? null : pickSrc({ sources: eps[0].sources }, 1080).url
        };
    });
}

// episode baru untuk series yang sudah ada di katalog
async function jqAppend(ex, r) {
    const { data, error } = await sb.from('episodes').select('season,number').eq('title_id', ex.id);
    if (error) throw error;
    const have = new Set((data || []).map(e => e.season + '-' + e.number));
    const eps = r._eps.filter(e => !have.has(e.season + '-' + e.number));
    if (eps.length) {
        const r2 = await sb.from('episodes').insert(eps.map(e => ({
            title_id: ex.id, season: e.season, number: e.number, name: e.name,
            video_url: pickSrc({ sources: e.sources }, 1080).url, thumbnail_url: e.thumb, sources: e.sources
        })));
        if (r2.error) throw r2.error;
    }
    return { added: eps.length, skipped: r._eps.length - eps.length };
}

const jqOn = id => { const s = $(id); return !s || s.classList.contains('on'); };
const jqOpts = () => ({ tmdb: jqOn('#jq_tm'), ladder: jqOn('#jq_lad') });
const jqNames = a => a.slice(0, 5).join(', ') + (a.length > 5 ? '…' : '');

// items: [{name, json, qid}]
async function jqProcess(items, o, bad = []) {
    jqBusy = true;
    impBack = 'jq';
    impPre = '';
    try {
        const ids = [], dead = [], empty = [];
        let records = [];
        items.forEach(it => {
            const r = jqRecords(it.json);
            if (r.length) { records.push(...r); if (it.qid) ids.push(it.qid); }
            else { empty.push(it.name); if (it.qid) dead.push(it.qid); }
        });
        if (dead.length && jqHas !== false) await sb.from('json_queue').delete().in('id', dead);
        if (bad.length) impPre += `${bad.length} file bukan JSON valid: ${jqNames(bad)}\n`;
        if (empty.length) impPre += `${empty.length} file tidak berisi data film (tidak ada source_quality): ${jqNames(empty)}\n`;

        const rows = jqBuild(records, o);
        if (!rows.length) {
            if (ids.length && jqHas !== false) await sb.from('json_queue').delete().in('id', ids);
            return finishImport('Tidak ada film yang bisa ditambahkan.');
        }

        const fresh = [], notes = [];
        let eAdd = 0, eSkip = 0;
        for (const r of rows) {
            const ex = titles.find(t => t.title.toLowerCase() === r.title.toLowerCase() && (!t.year || !r.year || t.year === r.year));
            if (ex && ex.type === 'series') { const a = await jqAppend(ex, r); eAdd += a.added; eSkip += a.skipped; notes.push(ex.title); }
            else fresh.push(r);
        }
        if (notes.length) impPre += `${eAdd} episode ditambahkan ke series yang sudah ada (${jqNames(notes)})${eSkip ? `, ${eSkip} episode dilewati karena sudah ada` : ''}\n`;

        const onOk = async () => {
            if (!ids.length || jqHas === false) return;
            const { error } = await sb.from('json_queue').delete().in('id', ids);
            if (!error) impPre += `${ids.length} file JSON sudah diambil isinya dan otomatis dihapus dari antrean\n`;
        };
        if (fresh.length) return await runImport(fresh, { tmdb: o.tmdb, onOk });
        impOk = true;
        await onOk();
        await refreshTitles();
        return finishImport('Tidak ada judul baru, semua sudah ada di katalog.');
    } catch (e) {
        impPre += 'File JSON tetap disimpan di antrean, bisa diproses ulang.\n';
        return finishImport('Gagal: ' + (e.message || e));
    } finally {
        jqBusy = false;
    }
}

async function jqRun() {
    if (jqBusy) return;
    const files = [...jqFiles];
    if (!files.length) return toast('Pilih file JSON dulu');
    jqBusy = true;
    jqFiles = [];
    const o = jqOpts(), items = [], bad = [];
    prog(.02, 'Membaca file…');
    for (const f of files) {
        try { items.push({ name: f.name, json: JSON.parse(await f.text()) }); } catch (e) { bad.push(f.name); }
    }
    if (jqHas !== false) {
        for (const it of items) {
            const { data, error } = await sb.from('json_queue').insert({ filename: it.name, content: it.json }).select('id').single();
            if (error) { if (jqMissing(error)) { jqHas = false; break; } } else it.qid = data.id;
        }
    }
    jqBusy = false;
    if (!items.length) { impPre = ''; return toast('Tidak ada file JSON yang valid'); }
    await jqProcess(items, o, bad);
}

async function jqRetry(id) {

}

// ===== thumbnail pintar: poster rusak / screenshot video diganti poster TMDB =====
const TH_FALLBACK = 'linear-gradient(155deg,var(--bg2),var(--ac) 260%)';
const thMemo = new Map(), thHeal = new Set();
const thAdmin = () => typeof me !== 'undefined' && me && me.role === 'admin';

// 'bad' kalau gambar gagal dimuat atau berbentuk lanskap (frame video), 'ok' selain itu
function thProbe(url) {
    if (!url || /image\.tmdb\.org/.test(url) || isFrame(url)) return Promise.resolve('ok');
    if (thMemo.has(url)) return thMemo.get(url);
    const p = new Promise(res => {
        const im = new Image();
        let done = false;
        const end = v => { if (!done) { done = true; res(v); } };
        im.onload = () => end(im.naturalWidth > im.naturalHeight * 1.1 ? 'bad' : 'ok');
        im.onerror = () => end('bad');
        setTimeout(() => end('ok'), 10000);
        im.src = url;
    });
    thMemo.set(url, p);
    return p;
}

const thUrl = m => m.poster.replace('/w342/', '/w500/');

async function thHealOne(t) {
    if (thHeal.has(t.id)) return;
    thHeal.add(t.id);
    const m = await tmdbFind({ title: t.title, year: t.year, type: t.type }).catch(() => null);
    if (!m || !m.poster) return;
    const url = thUrl(m);
    const { error } = await sb.from('titles').update({ thumbnail_url: url, tmdb_id: t.tmdb_id || m.id }).eq('id', t.id);
    if (error) return;
    t.thumbnail_url = url;
    document.querySelectorAll(`.poster[data-id="${t.id}"]`).forEach(el => { el.classList.remove('noimg', 'frm'); el.querySelectorAll('.frmi').forEach(i => i.remove()); el.style.backgroundImage = `url('${sm(url)}')`; delete el.dataset.bad; });
}

function thCheck(el) {
    if (el.dataset.pg) return;
    el.dataset.pg = '1';
    const t = titles.find(x => x.id == el.dataset.id);
    const m = /url\(["']?(.+?)["']?\)/.exec(el.style.backgroundImage || '');
    if (!m) { if (t && thAdmin() && (!t.thumbnail_url || isFrame(t.thumbnail_url))) thHealOne(t); return; }
    thProbe(m[1]).then(r => {
        if (r !== 'bad') return;
        el.style.backgroundImage = TH_FALLBACK;
        el.classList.add('noimg');
        el.dataset.bad = '1';
        if (t && thAdmin()) thHealOne(t);
    });
}

// perbaiki semua judul sekaligus (tombol di tab Upload JSON)
async function fixThumbs() {
    if (jqBusy) return;
    if (!titles.length) return toast('Katalog masih kosong');
    jqBusy = true;
    impBack = 'jq';
    impPre = '';
    try {
        let n = 0;
        const bad = [];
        await pool(titles, 6, async t => {
            if (!t.thumbnail_url || isFrame(t.thumbnail_url) || (await thProbe(t.thumbnail_url)) === 'bad') bad.push(t);
            prog(++n / titles.length * .4, `Memeriksa thumbnail ${n}/${titles.length}`);
        });
        if (!bad.length) { impOk = true; return await finishImport('Semua thumbnail sudah benar.'); }
        let ok = 0, k = 0;
        const miss = [];
        await pool(bad, 3, async t => {
            const m = await tmdbFind({ title: t.title, year: t.year, type: t.type }).catch(() => null);
            let done = false;
            if (m && m.poster) {
                const { error } = await sb.from('titles').update({ thumbnail_url: thUrl(m), tmdb_id: t.tmdb_id || m.id }).eq('id', t.id);
                done = !error;
            }
            if (done) ok++; else miss.push(t.title);
            prog(.4 + (++k / bad.length) * .6, `Mencari poster ${k}/${bad.length} · ${t.title}`);
        });
        impOk = true;
        return await finishImport(`${ok} dari ${bad.length} thumbnail diperbaiki dengan poster TMDB${miss.length ? `\nBelum ketemu di TMDB (tetap tampil sebagai kartu frame, bisa diisi manual): ${jqNames(miss)}` : ''}`);
    } catch (e) {
        return finishImport('Gagal memperbaiki thumbnail: ' + (e.message || e));
    } finally {
        jqBusy = false;
    }
}

function rwInit(row) {
    if (row.dataset.rw) return;
    row.dataset.rw = '1';
    const w = document.createElement('div');
    w.className = 'rw';
    row.parentNode.insertBefore(w, row);
    w.appendChild(row);
    const mk = d => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'rw-b ' + (d < 0 ? 'l' : 'r');
        b.setAttribute('aria-label', d < 0 ? 'Geser ke kiri' : 'Geser ke kanan');
        b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/></svg>`;
        b.onclick = () => row.scrollBy({ left: d * Math.max(200, row.clientWidth * .85), behavior: 'smooth' });
        return b;
    };
    const L = mk(-1), R = mk(1);
    w.append(L, R);
    const upd = row._upd = () => {
        L.hidden = row.scrollLeft < 8;
        R.hidden = row.scrollLeft + row.clientWidth >= row.scrollWidth - 8;
    };
    row.addEventListener('scroll', upd, { passive: true });
    addEventListener('resize', upd);
    upd();
}

(() => {

})();

function randomPick() {

    openTitle(t.id);
}

function setFs(k) {

setFs(localStorage.nm_fs || 'm');

async function clearHistory() {

async function saveName() {

async function savePass() {

async function loadStats() {

// ---- rating bintang ----
async function loadRatings() {
    const [{ data: a }, { data: b }, { data: c }] = await Promise.all([sb.from('title_ratings').select('*'), sb.from('ratings').select('title_id,stars').eq('user_id', me.id), sb.from('title_view_counts').select('*')]);
    ratings = {}; myR = {}; vcount = {};
    (a || []).forEach(r => ratings[r.title_id] = r);
    (b || []).forEach(r => myR[r.title_id] = r.stars);
    (c || []).forEach(r => vcount[r.title_id] = r.views);
}

function drawRate(id) {
    const el = $('#rate');
    if (!el) return;
    const r = ratings[id], mine = myR[id] || 0;
    el.innerHTML = `<div class="stars" role="radiogroup" aria-label="Beri rating">${[1, 2, 3, 4, 5].map(n => `<button class="st ${n <= mine ? 'on' : ''}" data-n="${n}" role="radio" aria-checked="${n === mine}" aria-label="${n} bintang">${ic('star')}</button>`).join('')}</div><small>${r ? `★ ${r.avg} dari ${r.n} penilaian` : 'Belum ada penilaian'}${mine ? ` · nilaimu ${mine}` : ''}</small>${mine ? '<button class="btn sm ghost" id="rclr">Hapus nilai</button>' : ''}`;
    el.querySelectorAll('.st').forEach(b => b.onclick = () => rate(id, +b.dataset.n));
    const c = $('#rclr');
    if (c) c.onclick = () => rate(id, 0);
}

async function rate(id, n) {
    const q = n ? sb.from('ratings').upsert({ user_id: me.id, title_id: id, stars: n, updated_at: new Date() }) : sb.from('ratings').delete().eq('user_id', me.id).eq('title_id', id);
    const { error } = await q;
    if (error) return toast(error.message);
    if (n) myR[id] = n; else delete myR[id];
    const { data } = await sb.from('title_ratings').select('*').eq('title_id', id).maybeSingle();
    if (data) ratings[id] = data; else delete ratings[id];
    drawRate(id);
    paintRating(id);
    toast(n ? `Rating ${n} bintang tersimpan` : 'Rating dihapus');
}

// ---- request film/series lewat TMDB (proxy Edge Function 'hub') ----
let rqSel = null, rqT = null, rqList = [];

function rqToggle() {
    const on = $('#fb_k').value === 'request';
    $('#rq').hidden = !on;
    if (!on) { rqSel = null; $('#rq_sel').innerHTML = ''; return; }

}

async function rqSearch(q) {

    q = q.trim();

    box.innerHTML = '<p class="hint">Mencari...</p>';

function rqPick(i) {

<script>
/* ===== judul animasi + koleksi (UI saja, data diisi lewat window.NMLib) ===== */
/* Kontrak data untuk nanti:
   NMLib.saved()      -> Promise<array judul>   (bentuk sama dengan `titles`)
   NMLib.liked()      -> Promise<array judul>
   NMLib.playlists()  -> Promise<[{id, name, count, cover}]>
   NMLib.createPlaylist() / NMLib.openPlaylist(id)  (opsional)
   Panggil libRefresh() setelah data berubah supaya angka di tombol ikut diperbarui. */
window.NMLib = window.NMLib || {};
const TTL_TEXT = 'Nour The Movie';
const ttlS = { timer: null, n: 0, dir: 1 };
const ttlCalm = () => document.documentElement.dataset.fx === 'low' || matchMedia('(prefers-reduced-motion: reduce)').matches;

function ttlInit() {
    const el = document.querySelector('#ttl .ttl-t');
    if (!el) return;
    el.innerHTML = [...TTL_TEXT].map((c, i) => c === ' ' ? `<span class="l sp" style="--i:${i}"></span>` : `<span class="l" style="--i:${i}">${c}</span>`).join('');
    ttlReset();
}

function ttlReset() {
    clearTimeout(ttlS.timer);
    const L = document.querySelectorAll('#ttl .l');
    if (!L.length) return;
    const el = document.querySelector('#ttl .ttl-t');
    if (ttlCalm()) {
        L.forEach(l => { l.classList.add('on'); l.classList.remove('cur'); });
        el.classList.remove('zero');
        return;
    }
    ttlS.n = 0; ttlS.dir = 1;
    L.forEach(l => l.classList.remove('on', 'cur'));
    ttlS.timer = setTimeout(ttlTick, 350);
}

function ttlTick() {
    const L = document.querySelectorAll('#ttl .l');
    if (!L.length) return;
    if (ttlCalm()) return ttlReset();
    if (document.hidden) { ttlS.timer = setTimeout(ttlTick, 800); return; }
    let n = ttlS.n, wait;
    if (ttlS.dir > 0) {
        n++;
        wait = 95 + Math.random() * 70;
        if (n >= L.length) { n = L.length; ttlS.dir = -1; wait = 2800; }
    } else {
        n--;
        wait = 42;
        if (n <= 0) { n = 0; ttlS.dir = 1; wait = 700; }
    }
    ttlS.n = n;
    L.forEach((l, i) => { l.classList.toggle('on', i < n); l.classList.toggle('cur', i === n - 1); });
    document.querySelector('#ttl .ttl-t').classList.toggle('zero', n === 0);
    ttlS.timer = setTimeout(ttlTick, wait);
}

function ttlClick(e) {
    const L = [...document.querySelectorAll('#ttl .l')];
    const hit = e.target.closest && e.target.closest('.l');
    const i = hit ? L.indexOf(hit) : (L.length >> 1);
    if (!ttlCalm()) {
        L.forEach((l, j) => {
            if (!l.classList.contains('on')) return;
            l.animate([{ transform: 'none' }, { transform: 'translateY(-.55em) scale(1.3) rotate(-6deg)', offset: .4 }, { transform: 'none' }],
                { duration: 560, delay: Math.abs(j - i) * 55, easing: 'cubic-bezier(.3,1.6,.4,1)' });
        });
    }
    if (typeof sClick === 'function') sClick();
    if (typeof tab !== 'undefined' && tab !== 'home') go('home');
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && document.querySelector('#ttl .l')) ttlTick(); });
(() => {
    const s = window.setFxLevel;
    if (typeof s === 'function') window.setFxLevel = q => { s(q); ttlReset(); };
})();

/* ---- rak koleksi ---- */
const LIB = {
    saved: { t: 'Film tersimpan', ic: 'bookmark', n: 'Tersimpan', empty: 'Belum ada film tersimpan. Tekan simpan di halaman film untuk menaruhnya di sini.' },
    liked: { t: 'Film yang kamu suka', ic: 'heart', n: 'Disukai', empty: 'Belum ada film yang disukai. Tekan suka di halaman film.' },
    playlists: { t: 'Playlist', ic: 'playlist', n: 'Playlist', empty: 'Belum ada playlist. Buat playlist untuk mengelompokkan film pilihanmu.' }
};

function shelfBtns() {
    return Object.entries(LIB).map(([k, v]) => `<button class="sh" data-k="${k}" data-n="0" aria-label="${v.t}" title="${v.t}" onclick="libOpen('${k}')">${ic(v.ic)}<span>${v.n}</span><em></em></button>`).join('');
}

async function libRefresh() {
    for (const k of Object.keys(LIB)) {
        let n = 0;
        try { const r = NMLib[k] && await NMLib[k](); n = Array.isArray(r) ? r.length : 0; } catch (e) { }
        document.querySelectorAll(`.sh[data-k="${k}"]`).forEach(b => {
            b.dataset.n = n;
            const em = b.querySelector('em');
            if (em) em.textContent = n > 99 ? '99+' : n;
        });
    }
}
window.libRefresh = libRefresh;

function libClose() {
    const m = document.getElementById('lib');
    if (m) m.remove();
}
addEventListener('keydown', e => { if (e.key === 'Escape') libClose(); });

async function libOpen(k) {
    libClose();
    const v = LIB[k];
    const m = document.createElement('div');
    m.className = 'modal';
    m.id = 'lib';
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
    m.setAttribute('aria-label', v.t);
    m.onclick = e => { if (e.target === m) libClose(); };
    const head = `<div class="libhead"><h2>${ic(v.ic)} ${v.t}</h2>${k === 'playlists' ? `<button class="btn sm" onclick="libNewPlaylist()">${ic('playlist')} Playlist baru</button>` : ''}</div>`;
    m.innerHTML = `<div class="sheet glass pad">${head}<div id="libbody">${skel(2)}</div><div class="libfoot"><button class="btn sm ghost" onclick="libClose()">Tutup</button></div></div>`;
    document.body.appendChild(m);
    let list = [];
    try { list = (NMLib[k] && await NMLib[k]()) || []; } catch (e) { list = []; }
    const body = document.getElementById('libbody');
    if (!body) return;
    if (!list.length) { body.innerHTML = empty(v.empty); return; }
    if (k === 'playlists') {
        body.innerHTML = list.map(p => `<button class="pl" onclick="libClose();NMLib.openPlaylist&&NMLib.openPlaylist('${esc(p.id)}')"><i ${bg(p.cover)}></i><span><b>${esc(p.name)}</b><small>${p.count ?? 0} film</small></span></button>`).join('');
    } else {
        body.innerHTML = `<div class="libgrid">${list.map(poster).join('')}</div>`;
        body.querySelector('.libgrid').addEventListener('click', () => libClose());
    }
}

function libNewPlaylist() {
    if (typeof NMLib.createPlaylist === 'function') NMLib.createPlaylist();
    else toast('Playlist baru segera hadir');
}
</script>
<script>
/* ===== popup "Update baru": diatur admin, muncul setelah loading selesai ===== */
const NT_DEF = { enabled: false, title: 'Update baru', body: '', ok_label: 'OK', auto_secs: 10 };

async function ntGet() {
    try {
        const { data, error } = await sb.from('app_notice').select('*').eq('id', 1).maybeSingle();
        if (error) throw error;
        if (data) return { ...NT_DEF, ...data };
        return { ...NT_DEF };
    } catch (e) {
        try { const l = JSON.parse(localStorage.nm_notice_local || 'null'); if (l) return { ...NT_DEF, ...l, _local: true }; } catch (x) { }
        return { ...NT_DEF };
    }
}

function ntClose() {
    const n = document.getElementById('nt');
    if (!n || n.classList.contains('out')) return;
    n.classList.add('out');
    setTimeout(() => n.remove(), 300);
}
addEventListener('keydown', e => { if (e.key === 'Escape') ntClose(); });

function ntShow(n) {
    const old = document.getElementById('nt');
    if (old) old.remove();
    const secs = Math.max(0, Math.min(120, +n.auto_secs || 0));
    const d = document.createElement('div');
    d.id = 'nt';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.setAttribute('aria-label', n.title || 'Update baru');
    d.onclick = e => { if (e.target === d) ntClose(); };
    d.innerHTML = `<div class="nc"><span class="nbadge">${ic('sparkle')} Baru</span><h3>${esc(n.title || 'Update baru')}</h3><p>${esc(n.body || '')}</p><button class="btn nok" onclick="ntClose()">${esc(n.ok_label || 'OK')}</button>${secs ? `<i class="nbar" style="--d:${secs}s"></i>` : ''}</div>`;
    document.body.appendChild(d);
    if (typeof sClick === 'function') sClick();
    const ok = d.querySelector('.nok');
    if (ok) ok.focus({ preventScroll: true });
    if (secs) {
        const bar = d.querySelector('.nbar');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(ntClose, secs * 1000);
        else bar.addEventListener('animationend', ntClose);
    }
}

// pengumuman aktif 7 hari sejak admin menyimpan, setelah itu hilang sendiri
const NT_MS = 7 * 864e5;
let NT_CUR = null;
const ntLive = n => {
    if (!n || !n.enabled || !(n.body || '').trim()) return false;
    const t = Date.parse(n.updated_at);
    return isNaN(t) || Date.now() - t < NT_MS;
};
const ntLeft = n => { const t = Date.parse(n.updated_at); return isNaN(t) ? 7 : Math.max(1, Math.ceil((t + NT_MS - Date.now()) / 864e5)); };

function ntBanner() {
    const old = document.getElementById('ntb');
    if (old) old.remove();
    if (!NT_CUR || tab !== 'home') return;
    const h = document.getElementById('hero');
    if (!h) return;
    h.insertAdjacentHTML('beforebegin', `<button class="ntb glass" id="ntb" onclick="ntShow({...NT_CUR,auto_secs:0})"><span class="nbadge">${ic('sparkle')} Baru</span><b>${esc(NT_CUR.title || 'Update baru')}</b><small>${ntLeft(NT_CUR)} hari lagi</small></button>`);
}

// admin menyimpan pengumuman -> pengguna yang sedang online langsung dapat popup; cek lagi saat kembali ke tab dan tiap 5 menit
function ntWatch() {
    if (ntWatch.on) return;
    ntWatch.on = true;
    try { sb.channel('nt-live').on('postgres_changes', { event: '*', schema: 'public', table: 'app_notice' }, () => showNotice()).subscribe(); } catch (e) { }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) showNotice(); });
    setInterval(() => { if (!document.hidden) showNotice(); }, 300000);
}

async function showNotice() {
    ntWatch();
    if (document.getElementById('nt')) return;
    const n = await ntGet();
    NT_CUR = ntLive(n) ? n : null;
    ntBanner();
    if (!NT_CUR) return;
    const ver = String(n.updated_at || n.title + '|' + n.body);
    if (localStorage.nm_notice_seen === ver) return;
    localStorage.nm_notice_seen = ver;
    setTimeout(() => ntShow(n), 500);
}

/* ---- panel admin ---- */
function noticeForm() {
    return `<div class="glass pad"><p class="hint">Pesan ini muncul sekali ke semua pengguna (baru maupun lama) sebagai popup, dan tetap terlihat sebagai kartu Baru di Home selama 7 hari sejak disimpan, lalu hilang sendiri. Pengguna yang sedang online langsung menerimanya. Setiap kali kamu menyimpan, pesan dianggap baru dan hitungan 7 hari mulai lagi.</p>
<div class="srow"><div><b>Tampilkan popup</b><small>Matikan untuk menyembunyikan dari semua pengguna</small></div><button class="sw" id="n_on" role="switch" aria-checked="false" onclick="setSw(this,!this.classList.contains('on'))"></button></div>
<div class="fgrid"><label class="fld"><span>Judul</span><input id="n_t" maxlength="60" placeholder="Update baru"></label>
<label class="fld"><span>Teks tombol</span><input id="n_ok" maxlength="20" placeholder="OK"></label>
<label class="fld"><span>Tutup otomatis (detik, 0 = manual)</span><input id="n_s" type="number" min="0" max="120" placeholder="10"></label></div>
<label class="fld"><span>Isi pesan</span><textarea id="n_b" maxlength="600" rows="5" placeholder="Contoh: Sekarang ada tampilan burgundy dan pengaturan kualitas efek di menu Lainnya."></textarea></label>
<div class="pf"><button class="btn" id="n_save" onclick="saveNotice()">Simpan</button><button class="btn ghost" onclick="previewNotice()">Pratinjau</button></div><p class="hint" id="n_msg"></p></div>`;
}

async function loadNotice() {
    const n = await ntGet();
    if (tab !== 'admin' || !document.getElementById('n_t')) return;
    setSw(document.getElementById('n_on'), !!n.enabled);
    n_t.value = n.title || ''; n_ok.value = n.ok_label || ''; n_s.value = n.auto_secs ?? 10; n_b.value = n.body || '';
    if (n._local) n_msg.textContent = 'Tabel app_notice belum ada di Supabase. Pesan yang tersimpan hanya berlaku di perangkat ini.';
    else if (n.enabled && (n.body || '').trim() && n.updated_at) n_msg.textContent = ntLive(n) ? `Sedang tampil, sisa ${ntLeft(n)} hari.` : 'Sudah lewat 7 hari dan disembunyikan. Simpan ulang untuk menampilkannya lagi.';
}

function noticeRead() {
    return {
        enabled: document.getElementById('n_on').classList.contains('on'),
        title: n_t.value.trim() || 'Update baru',
        body: n_b.value.trim(),
        ok_label: n_ok.value.trim() || 'OK',
        auto_secs: Math.max(0, Math.min(120, parseInt(n_s.value, 10) || 0))
    };
}

function previewNotice() {
    const n = noticeRead();
    if (!n.body) return toast('Isi pesan dulu');
    ntShow(n);
}

async function saveNotice() {
    const n = noticeRead();
    if (n.enabled && !n.body) return toast('Isi pesan dulu');
    const b = document.getElementById('n_save');
    b.disabled = true;
    const row = { id: 1, ...n, updated_at: new Date().toISOString() };
    const { error } = await sb.from('app_notice').upsert(row);
    b.disabled = false;
    if (error) {
        localStorage.nm_notice_local = JSON.stringify(row);
        n_msg.textContent = 'Belum tersimpan ke server: ' + error.message + '. Disimpan lokal di perangkat ini saja.';
        return toast('Tersimpan lokal');
    }
    localStorage.removeItem('nm_notice_local');
    n_msg.textContent = '';
    toast('Tersimpan');
}
</script>
<script>
/* ===== aksi film (suka, simpan, playlist) + chat stream, tersambung ke Supabase ===== */
const FS = {};   // cache status per judul: { liked, likes, saved }
const ACTS = [['like', 'heart', 'Suka'], ['save', 'bookmark', 'Simpan'], ['pl', 'playlist', 'Playlist']];

async function filmState(id) {
    const [l, c, s] = await Promise.all([
        sb.from('likes').select('title_id').eq('user_id', me.id).eq('title_id', id).maybeSingle(),
        sb.from('likes').select('*', { count: 'exact', head: true }).eq('title_id', id),
        sb.from('downloads').select('title_id').eq('user_id', me.id).eq('title_id', id).maybeSingle()
    ]);
    return FS[id] = { liked: !!l.data, likes: c.count || 0, saved: !!s.data };
}

function actsPaint(id) {
    const st = FS[id] || { liked: false, likes: 0, saved: false };
    document.querySelectorAll(`[data-acts][data-id="${id}"]`).forEach(box => {

/* ---- chat stream per judul (realtime) ---- */
let CC = null;
const CC_EMO = ['❤️', '😂', '😮', '👏', '🔥'];

function chatStop() {
    if (!CC) return;
    clearInterval(CC.tick);
    try { sb.removeChannel(CC.ch); } catch (e) { }
    CC = null;
}

function ccTime(iso) {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 45) return 'baru saja';
    if (s < 3600) return Math.floor(s / 60) + ' mnt';
    return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function chatStart(root, t) {
    chatStop();
    if (!root) return;
    root.innerHTML = `<div class="cc-h"><b>Obrolan</b><span class="cc-live"><i></i><span id="cc_n">1</span> menonton</span></div>
<div class="cc-l" id="cc_l" role="log" aria-live="polite"></div>
<div class="cc-r" role="group" aria-label="Reaksi cepat">${CC_EMO.map(e => `<button type="button" data-e="${e}" aria-label="Kirim ${e}">${e}</button>`).join('')}</div>
<div class="cc-f"><input id="cc_i" maxlength="300" placeholder="Tulis komentar..." autocomplete="off"><button class="btn sm" id="cc_s">Kirim</button></div>`;
    const list = root.querySelector('#cc_l');
    const seen = new Set();
    let more = 0, last = 0, moreBtn = null;
    CC = { id: t.id, ch: null, tick: null };
    const near = () => list.scrollHeight - list.scrollTop - list.clientHeight < 80;
    const toEnd = smooth => list.scrollTo({ top: list.scrollHeight, behavior: smooth && document.documentElement.dataset.fx !== 'low' ? 'smooth' : 'auto' });
    const fly = e => {
        if (document.documentElement.dataset.fx === 'low' || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        let layer = root.querySelector('.cc-fly');
        if (!layer) { layer = document.createElement('div'); layer.className = 'cc-fly'; list.parentNode.insertBefore(layer, list.nextSibling); layer.style.cssText = 'position:absolute'; }
        if (layer.children.length > 10) return;
        const s = document.createElement('span');
        s.textContent = e;
        s.style.cssText = `left:${10 + Math.random() * 80}%;--dx:${(Math.random() - .5) * 60}px`;
        layer.appendChild(s);
        setTimeout(() => s.remove(), 1900);
    };
    const row = (m, isNew) => {
        if (seen.has(m.id)) return;
        seen.add(m.id);
        const mine = m.user_id === me.id, st = m.kind === 'sticker';
        const d = document.createElement('div');
        d.className = 'cc-m' + (mine ? ' me' : '') + (isNew ? ' new' : '');
        d.dataset.id = m.id;
        d.innerHTML = `${av(m.avatar || 'kucing', 30)}<div class="cc-b ${st ? 'st' : ''}"><small><b>${esc(m.username)}</b><span data-t="${esc(m.created_at)}">${ccTime(m.created_at)}</span>${mine || me.role === 'admin' ? `<button class="cc-x" aria-label="Hapus pesan" title="Hapus">${ic('x')}</button>` : ''}</small><p>${esc(m.msg)}</p></div>`;
        const x = d.querySelector('.cc-x');
        if (x) { x.querySelector('.ic').style.cssText = 'width:12px;height:12px'; x.onclick = async () => { const { error } = await sb.from('title_comments').delete().eq('id', m.id); if (error) toast(error.message); else d.remove(); }; }
        const was = near();
        list.querySelector('.cc-e')?.remove();
        list.appendChild(d);
        if (isNew && !mine && !was) {
            more++;
            if (!moreBtn) { moreBtn = document.createElement('button'); moreBtn.className = 'cc-more'; moreBtn.onclick = () => { toEnd(true); }; list.appendChild(moreBtn); }
            moreBtn.textContent = more + ' pesan baru';
            list.appendChild(moreBtn);
        } else if (isNew || was) toEnd(isNew);
        if (isNew && st) fly(m.msg);
    };
    list.addEventListener('scroll', () => { if (near() && moreBtn) { moreBtn.remove(); moreBtn = null; more = 0; } }, { passive: true });

    sb.from('title_comments').select('*').eq('title_id', t.id).order('created_at', { ascending: false }).limit(40).then(({ data, error }) => {
        if (!CC || CC.id !== t.id) return;
        if (error) { list.innerHTML = `<p class="cc-e">Obrolan belum bisa dimuat. ${esc(error.message)}</p>`; return; }
        (data || []).reverse().forEach(m => row(m, false));
        if (!data || !data.length) list.innerHTML = '<p class="cc-e">Belum ada komentar. Jadilah yang pertama menyapa.</p>';
        else toEnd(false);
    });

    const ch = sb.channel('tc-' + t.id, { config: { presence: { key: me.id } } });
    ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'title_comments', filter: 'title_id=eq.' + t.id }, p => { if (CC && CC.id === t.id) row(p.new, true); })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'title_comments' }, p => { list.querySelector(`.cc-m[data-id="${p.old.id}"]`)?.remove(); })
      .on('presence', { event: 'sync' }, () => { const n = document.getElementById('cc_n'); if (n) n.textContent = Math.max(1, Object.keys(ch.presenceState()).length); })
      .subscribe(s => { if (s === 'SUBSCRIBED') ch.track({ u: me.username }); });
    CC.ch = ch;
    CC.tick = setInterval(() => root.querySelectorAll('[data-t]').forEach(el => el.textContent = ccTime(el.dataset.t)), 30000);

    const send = async (msg, kind) => {
        msg = msg.trim();
        if (!msg) return;
        if (Date.now() - last < (kind === 'sticker' ? 600 : 1500)) return toast('Pelan-pelan ya');
        last = Date.now();
        const { data, error } = await sb.from('title_comments').insert({ title_id: t.id, username: me.username, avatar: me.avatar || 'kucing', kind, msg: msg.slice(0, 300) }).select('*').single();
        if (error) return toast(error.message);
        row(data, true);
        toEnd(true);
    };
    const inp = root.querySelector('#cc_i');
    const go = () => { const v = inp.value; inp.value = ''; send(v, 'text'); };
    root.querySelector('#cc_s').onclick = go;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    root.querySelector('.cc-r').onclick = e => { const b = e.target.closest('button'); if (b) send(b.dataset.e, 'sticker'); };
}

const _liveT = {};
