    } catch (e) {
        try { const l = JSON.parse(localStorage.nm_notice_local || 'null'); if (l) return { ...NT_DEF, ...l, _local: true }; } catch (x) { }
        return { ...NT_DEF };
    }
}

function ntClose() {
    const n = document.getElementById('nt');
    if (!n || n.classList.contains('out')) return;
    n.classList.add('out');
    setTimeout(() => n.remove(), 300);
}
addEventListener('keydown', e => { if (e.key === 'Escape') ntClose(); });

function ntShow(n) {
    const old = document.getElementById('nt');
    if (old) old.remove();
    const secs = Math.max(0, Math.min(120, +n.auto_secs || 0));
    const d = document.createElement('div');
    d.id = 'nt';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.setAttribute('aria-label', n.title || 'Update baru');
    d.onclick = e => { if (e.target === d) ntClose(); };
    d.innerHTML = `<div class="nc"><span class="nbadge">${ic('sparkle')} Baru</span><h3>${esc(n.title || 'Update baru')}</h3><p>${esc(n.body || '')}</p><button class="btn nok" onclick="ntClose()">${esc(n.ok_label || 'OK')}</button>${secs ? `<i class="nbar" style="--d:${secs}s"></i>` : ''}</div>`;
    document.body.appendChild(d);
    if (typeof sClick === 'function') sClick();
    const ok = d.querySelector('.nok');
    if (ok) ok.focus({ preventScroll: true });
    if (secs) {
        const bar = d.querySelector('.nbar');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(ntClose, secs * 1000);
        else bar.addEventListener('animationend', ntClose);
    }
}

async function showNotice() {
    if (document.getElementById('nt')) return;
    const n = await ntGet();
    if (!n.enabled || !(n.body || '').trim()) return;
    const ver = String(n.updated_at || n.title + '|' + n.body);
    if (localStorage.nm_notice_seen === ver) return;
    localStorage.nm_notice_seen = ver;
    setTimeout(() => ntShow(n), 500);
}

/* ---- panel admin ---- */
function noticeForm() {
    return `<div class="glass pad"><p class="hint">Pesan ini muncul sekali ke setiap pengguna setelah loading selesai. Setiap kali kamu menyimpan, pesan dianggap baru dan muncul lagi.</p>
<div class="srow"><div><b>Tampilkan popup</b><small>Matikan untuk menyembunyikan dari semua pengguna</small></div><button class="sw" id="n_on" role="switch" aria-checked="false" onclick="setSw(this,!this.classList.contains('on'))"></button></div>
<div class="fgrid"><label class="fld"><span>Judul</span><input id="n_t" maxlength="60" placeholder="Update baru"></label>
<label class="fld"><span>Teks tombol</span><input id="n_ok" maxlength="20" placeholder="OK"></label>
<label class="fld"><span>Tutup otomatis (detik, 0 = manual)</span><input id="n_s" type="number" min="0" max="120" placeholder="10"></label></div>
<label class="fld"><span>Isi pesan</span><textarea id="n_b" maxlength="600" rows="5" placeholder="Contoh: Sekarang ada tampilan burgundy dan pengaturan kualitas efek di menu Lainnya."></textarea></label>
<div class="pf"><button class="btn" id="n_save" onclick="saveNotice()">Simpan</button><button class="btn ghost" onclick="previewNotice()">Pratinjau</button></div><p class="hint" id="n_msg"></p></div>`;
}

async function loadNotice() {
    const n = await ntGet();
    if (tab !== 'admin' || !document.getElementById('n_t')) return;
    setSw(document.getElementById('n_on'), !!n.enabled);
    n_t.value = n.title || ''; n_ok.value = n.ok_label || ''; n_s.value = n.auto_secs ?? 10; n_b.value = n.body || '';
    if (n._local) n_msg.textContent = 'Tabel app_notice belum ada di Supabase. Pesan yang tersimpan hanya berlaku di perangkat ini.';
}

function noticeRead() {
    return {
        enabled: document.getElementById('n_on').classList.contains('on'),
        title: n_t.value.trim() || 'Update baru',
        body: n_b.value.trim(),
        ok_label: n_ok.value.trim() || 'OK',
        auto_secs: Math.max(0, Math.min(120, parseInt(n_s.value, 10) || 0))
    };
}

function previewNotice() {
    const n = noticeRead();
    if (!n.body) return toast('Isi pesan dulu');
    ntShow(n);
}

async function saveNotice() {
    const n = noticeRead();
    if (n.enabled && !n.body) return toast('Isi pesan dulu');
    const b = document.getElementById('n_save');
    b.disabled = true;
    const row = { id: 1, ...n, updated_at: new Date().toISOString() };
    const { error } = await sb.from('app_notice').upsert(row);
    b.disabled = false;
    if (error) {
        localStorage.nm_notice_local = JSON.stringify(row);
        n_msg.textContent = 'Belum tersimpan ke server: ' + error.message + '. Disimpan lokal di perangkat ini saja.';
        return toast('Tersimpan lokal');
    }
    localStorage.removeItem('nm_notice_local');
    n_msg.textContent = '';
    toast('Tersimpan');
}
</script>
<script>
/* ===== aksi film (suka, simpan, playlist) + chat stream, tersambung ke Supabase ===== */
const FS = {};   // cache status per judul: { liked, likes, saved }
const ACTS = [['like', 'heart', 'Suka'], ['save', 'bookmark', 'Simpan'], ['pl', 'playlist', 'Playlist']];

async function filmState(id) {
    const [l, c, s] = await Promise.all([
        sb.from('likes').select('title_id').eq('user_id', me.id).eq('title_id', id).maybeSingle(),
        sb.from('likes').select('*', { count: 'exact', head: true }).eq('title_id', id),
        sb.from('downloads').select('title_id').eq('user_id', me.id).eq('title_id', id).maybeSingle()
    ]);
    return FS[id] = { liked: !!l.data, likes: c.count || 0, saved: !!s.data };
}

function actsPaint(id) {
    const st = FS[id] || { liked: false, likes: 0, saved: false };
    document.querySelectorAll(`[data-acts][data-id="${id}"]`).forEach(box => {
        box.querySelector('[data-a=like]').classList.toggle('on', st.liked);
        box.querySelector('[data-a=like] em').textContent = st.likes > 0 ? st.likes : '';
        const sv = box.querySelector('[data-a=save]');
        sv.classList.toggle('on', st.saved);
        sv.querySelector('span').textContent = st.saved ? 'Tersimpan' : 'Simpan';
    });
}

function filmActs(box, t) {
    if (!box) return;
    box.dataset.id = t.id;
    box.innerHTML = ACTS.map(([a, i, l]) => `<button class="btn sm ghost act" data-a="${a}">${ic(i)}<span>${l}</span>${a === 'like' ? '<em></em>' : ''}</button>`).join('');
    box.onclick = e => {
        const b = e.target.closest('.act');
        if (!b) return;
        if (b.dataset.a === 'like') actLike(t.id, b);
        else if (b.dataset.a === 'save') actSave(t.id);
        else plSheet(t.id);
    };
    actsPaint(t.id);
    filmState(t.id).then(() => actsPaint(t.id)).catch(() => { });
}

async function actLike(id, btn) {
    const st = FS[id] || (FS[id] = { liked: false, likes: 0, saved: false });
    const was = st.liked;
    st.liked = !was; st.likes = Math.max(0, st.likes + (was ? -1 : 1));
    actsPaint(id);
    if (!was && document.documentElement.dataset.fx !== 'low' && btn && btn.animate)
        btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.3,1.6,.4,1)' });
    const { error } = was ? await sb.from('likes').delete().eq('user_id', me.id).eq('title_id', id) : await sb.from('likes').insert({ title_id: id });
    if (error && !/duplicate/i.test(error.message)) {
        st.liked = was; st.likes = Math.max(0, st.likes + (was ? 1 : -1)); actsPaint(id);
        return toast(error.message);
    }
    toast(was ? 'Suka dibatalkan' : 'Disukai');
    libRefresh();
}

async function actSave(id) {
    const st = FS[id] || (FS[id] = { liked: false, likes: 0, saved: false });
    const was = st.saved;
    st.saved = !was; actsPaint(id);
    const { error } = was ? await sb.from('downloads').delete().eq('user_id', me.id).eq('title_id', id) : await sb.from('downloads').upsert({ user_id: me.id, title_id: id });
    if (error) { st.saved = was; actsPaint(id); return toast(error.message); }
    toast(was ? 'Dihapus dari tersimpan' : 'Tersimpan');
    libRefresh();
}

/* ---- playlist ---- */
function plClose() { const m = document.getElementById('pls'); if (m) m.remove(); }

async function plSheet(titleId) {
    plClose();
    const m = document.createElement('div');
    m.className = 'modal'; m.id = 'pls';
    m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', 'Simpan ke playlist');
    m.onclick = e => { if (e.target === m) plClose(); };
    m.innerHTML = `<div class="sheet glass pad"><h2>${ic('playlist')} Simpan ke playlist</h2><div id="plbody">${skel(1)}</div>
<div class="plnew"><input id="pl_n" maxlength="40" placeholder="Nama playlist baru" autocomplete="off"><button class="btn sm" id="pl_go">Buat</button></div>
<div class="libfoot"><button class="btn sm ghost" onclick="plClose()">Selesai</button></div></div>`;
    document.body.appendChild(m);
    const draw = async () => {
        const [{ data: pls }, { data: its }] = await Promise.all([
            sb.from('playlists').select('id,name').eq('user_id', me.id).order('created_at', { ascending: false }),
            sb.from('playlist_items').select('playlist_id').eq('title_id', titleId)
        ]);
        const has = new Set((its || []).map(x => x.playlist_id));
        const body = document.getElementById('plbody');
        if (!body) return;
        body.innerHTML = (pls || []).map(p => `<button class="plr ${has.has(p.id) ? 'on' : ''}" data-p="${p.id}"><b>${esc(p.name)}</b><span class="ck">${ic('check')}</span></button>`).join('') || '<p class="hint">Belum punya playlist. Buat yang pertama di bawah.</p>';
        body.querySelectorAll('.plr').forEach(b => b.onclick = async () => {
            const pid = +b.dataset.p, on = b.classList.contains('on');
            b.classList.toggle('on', !on);
            const { error } = on ? await sb.from('playlist_items').delete().eq('playlist_id', pid).eq('title_id', titleId) : await sb.from('playlist_items').insert({ playlist_id: pid, title_id: titleId });
            if (error) { b.classList.toggle('on', on); return toast(error.message); }
            libRefresh();
        });
    };
    const make = async () => {
        const name = document.getElementById('pl_n').value.trim();
        if (!name) return toast('Isi nama playlist dulu');
        const go = document.getElementById('pl_go'); go.disabled = true;
        const { data, error } = await sb.from('playlists').insert({ name }).select('id').single();
        if (!error && titleId) await sb.from('playlist_items').insert({ playlist_id: data.id, title_id: titleId });
        go.disabled = false;
        if (error) return toast(error.message);
        document.getElementById('pl_n').value = '';
        toast('Playlist dibuat');
        libRefresh();
        draw();
    };
    document.getElementById('pl_go').onclick = make;
    document.getElementById('pl_n').addEventListener('keydown', e => { if (e.key === 'Enter') make(); });
    draw();
}

/* ---- sambungkan ke rak koleksi di header (NMLib) ---- */
const byIds = ids => ids.map(i => titles.find(t => t.id == i)).filter(Boolean);
NMLib.saved = async () => byIds(((await sb.from('downloads').select('title_id').eq('user_id', me.id).order('created_at', { ascending: false })).data || []).map(x => x.title_id));
NMLib.liked = async () => byIds(((await sb.from('likes').select('title_id').eq('user_id', me.id).order('created_at', { ascending: false })).data || []).map(x => x.title_id));
NMLib.playlists = async () => {
    const { data } = await sb.from('playlists').select('id,name,playlist_items(title_id)').eq('user_id', me.id).order('created_at', { ascending: false });
    return (data || []).map(p => {
        const first = byIds((p.playlist_items || []).map(x => x.title_id))[0];
        return { id: p.id, name: p.name, count: (p.playlist_items || []).length, cover: first && sm(first.thumbnail_url, 'w154') };
    });
};
NMLib.createPlaylist = () => { libClose(); plSheet(null); };
NMLib.openPlaylist = async id => {
    const { data: pl } = await sb.from('playlists').select('id,name').eq('id', id).maybeSingle();
    const { data: its } = await sb.from('playlist_items').select('title_id').eq('playlist_id', id).order('added_at', { ascending: false });
    const list = byIds((its || []).map(x => x.title_id));
    libClose();
    const m = document.createElement('div');
    m.className = 'modal'; m.id = 'lib';
    m.onclick = e => { if (e.target === m) libClose(); };
    m.innerHTML = `<div class="sheet glass pad"><div class="libhead"><h2>${ic('playlist')} ${esc(pl ? pl.name : 'Playlist')}</h2><button class="btn sm danger" id="pl_del">Hapus</button></div>${list.length ? `<div class="libgrid">${list.map(poster).join('')}</div>` : empty('Playlist ini masih kosong. Tambahkan dari halaman film.')}<div class="libfoot"><button class="btn sm ghost" onclick="libClose()">Tutup</button></div></div>`;
    document.body.appendChild(m);
    const g = m.querySelector('.libgrid');
    if (g) g.addEventListener('click', () => libClose());
    document.getElementById('pl_del').onclick = async () => {
        if (!confirm('Hapus playlist ini?')) return;
        const { error } = await sb.from('playlists').delete().eq('id', id);
        if (error) return toast(error.message);
        libClose(); libRefresh(); toast('Playlist dihapus');
    };
};

/* ---- chat stream per judul (realtime) ---- */
let CC = null;
const CC_EMO = ['❤️', '😂', '😮', '👏', '🔥'];

function chatStop() {
    if (!CC) return;
    clearInterval(CC.tick);
    try { sb.removeChannel(CC.ch); } catch (e) { }
    CC = null;
}

function ccTime(iso) {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 45) return 'baru saja';
    if (s < 3600) return Math.floor(s / 60) + ' mnt';
    return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function chatStart(root, t) {
    chatStop();
    if (!root) return;
    root.innerHTML = `<div class="cc-h"><b>Obrolan</b><span class="cc-live"><i></i><span id="cc_n">1</span> menonton</span></div>
<div class="cc-l" id="cc_l" role="log" aria-live="polite"></div>
<div class="cc-r" role="group" aria-label="Reaksi cepat">${CC_EMO.map(e => `<button type="button" data-e="${e}" aria-label="Kirim ${e}">${e}</button>`).join('')}</div>
<div class="cc-f"><input id="cc_i" maxlength="300" placeholder="Tulis komentar..." autocomplete="off"><button class="btn sm" id="cc_s">Kirim</button></div>`;
    const list = root.querySelector('#cc_l');
    const seen = new Set();
    let more = 0, last = 0, moreBtn = null;
    CC = { id: t.id, ch: null, tick: null };
    const near = () => list.scrollHeight - list.scrollTop - list.clientHeight < 80;
    const toEnd = smooth => list.scrollTo({ top: list.scrollHeight, behavior: smooth && document.documentElement.dataset.fx !== 'low' ? 'smooth' : 'auto' });
    const fly = e => {
        if (document.documentElement.dataset.fx === 'low' || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        let layer = root.querySelector('.cc-fly');
        if (!layer) { layer = document.createElement('div'); layer.className = 'cc-fly'; list.parentNode.insertBefore(layer, list.nextSibling); layer.style.cssText = 'position:absolute'; }
        if (layer.children.length > 10) return;
        const s = document.createElement('span');
        s.textContent = e;
        s.style.cssText = `left:${10 + Math.random() * 80}%;--dx:${(Math.random() - .5) * 60}px`;
        layer.appendChild(s);
        setTimeout(() => s.remove(), 1900);
    };
    const row = (m, isNew) => {
        if (seen.has(m.id)) return;
        seen.add(m.id);
        const mine = m.user_id === me.id, st = m.kind === 'sticker';
        const d = document.createElement('div');
        d.className = 'cc-m' + (mine ? ' me' : '') + (isNew ? ' new' : '');
        d.dataset.id = m.id;
        d.innerHTML = `${av(m.avatar || 'kucing', 30)}<div class="cc-b ${st ? 'st' : ''}"><small><b>${esc(m.username)}</b><span data-t="${esc(m.created_at)}">${ccTime(m.created_at)}</span>${mine || me.role === 'admin' ? `<button class="cc-x" aria-label="Hapus pesan" title="Hapus">${ic('x')}</button>` : ''}</small><p>${esc(m.msg)}</p></div>`;
        const x = d.querySelector('.cc-x');
        if (x) { x.querySelector('.ic').style.cssText = 'width:12px;height:12px'; x.onclick = async () => { const { error } = await sb.from('title_comments').delete().eq('id', m.id); if (error) toast(error.message); else d.remove(); }; }
        const was = near();
        list.querySelector('.cc-e')?.remove();
        list.appendChild(d);
        if (isNew && !mine && !was) {
            more++;
            if (!moreBtn) { moreBtn = document.createElement('button'); moreBtn.className = 'cc-more'; moreBtn.onclick = () => { toEnd(true); }; list.appendChild(moreBtn); }
            moreBtn.textContent = more + ' pesan baru';
            list.appendChild(moreBtn);
        } else if (isNew || was) toEnd(isNew);
        if (isNew && st) fly(m.msg);
    };
    list.addEventListener('scroll', () => { if (near() && moreBtn) { moreBtn.remove(); moreBtn = null; more = 0; } }, { passive: true });

    sb.from('title_comments').select('*').eq('title_id', t.id).order('created_at', { ascending: false }).limit(40).then(({ data, error }) => {
        if (!CC || CC.id !== t.id) return;
        if (error) { list.innerHTML = `<p class="cc-e">Obrolan belum bisa dimuat. ${esc(error.message)}</p>`; return; }
        (data || []).reverse().forEach(m => row(m, false));
        if (!data || !data.length) list.innerHTML = '<p class="cc-e">Belum ada komentar. Jadilah yang pertama menyapa.</p>';
        else toEnd(false);
    });

    const ch = sb.channel('tc-' + t.id, { config: { presence: { key: me.id } } });
    ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'title_comments', filter: 'title_id=eq.' + t.id }, p => { if (CC && CC.id === t.id) row(p.new, true); })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'title_comments' }, p => { list.querySelector(`.cc-m[data-id="${p.old.id}"]`)?.remove(); })
      .on('presence', { event: 'sync' }, () => { const n = document.getElementById('cc_n'); if (n) n.textContent = Math.max(1, Object.keys(ch.presenceState()).length); })
      .subscribe(s => { if (s === 'SUBSCRIBED') ch.track({ u: me.username }); });
    CC.ch = ch;
    CC.tick = setInterval(() => root.querySelectorAll('[data-t]').forEach(el => el.textContent = ccTime(el.dataset.t)), 30000);

    const send = async (msg, kind) => {
        msg = msg.trim();
        if (!msg) return;
        if (Date.now() - last < (kind === 'sticker' ? 600 : 1500)) return toast('Pelan-pelan ya');
        last = Date.now();
        const { data, error } = await sb.from('title_comments').insert({ title_id: t.id, username: me.username, avatar: me.avatar || 'kucing', kind, msg: msg.slice(0, 300) }).select('*').single();
        if (error) return toast(error.message);
        row(data, true);
        toEnd(true);
    };
    const inp = root.querySelector('#cc_i');
    const go = () => { const v = inp.value; inp.value = ''; send(v, 'text'); };
    root.querySelector('#cc_s').onclick = go;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    root.querySelector('.cc-r').onclick = e => { const b = e.target.closest('button'); if (b) send(b.dataset.e, 'sticker'); };
}
</script>
<script>
/* ===== tontonan + rating live: poster & pemutar update otomatis lewat Supabase Realtime ===== */
const fmtN = n => Number(n || 0).toLocaleString('id-ID');
const viewsHtml = id => `${ic('eye')} ${fmtN(vcount[id])}x ditonton`;

function paintViews(id) {
    document.querySelectorAll(`[data-views="${id}"]`).forEach(el => el.innerHTML = viewsHtml(id));
}

function paintRating(id) {
    document.querySelectorAll(`.poster[data-id="${id}"]`).forEach(p => {
        let e = p.querySelector(':scope > .rt');
        if (ratings[id]) {
            if (e) e.textContent = `★ ${ratings[id].avg}`;
            else p.insertAdjacentHTML('afterbegin', rtBadge(id));
        } else if (e) e.remove();
    });
    if (document.querySelector('#rate') && document.querySelector('#fplayer [data-views="' + id + '"]')) drawRate(id);
}

async function refreshViews(id) {
    try {
        const { data } = await sb.from('title_view_counts').select('views').eq('title_id', id).maybeSingle();
        vcount[id] = data ? data.views : 0;
        paintViews(id);
    } catch (e) { }
}

async function refreshRating(id) {
    try {
        const [{ data: r }, { data: m }] = await Promise.all([
            sb.from('title_ratings').select('*').eq('title_id', id).maybeSingle(),
            sb.from('ratings').select('stars').eq('user_id', me.id).eq('title_id', id).maybeSingle()
        ]);
        if (r) ratings[id] = r; else delete ratings[id];
        if (m) myR[id] = m.stars; else delete myR[id];
        paintRating(id);
    } catch (e) { }
}

// 1 tontonan per user per jam (dedupe di database), jadi aman dipanggil berulang
async function recordView(id) {
    try {
        await sb.from('title_views').insert({ title_id: id });
        await refreshViews(id);
    } catch (e) { }
}

const _liveT = {};
const _debounce = (k, fn) => { clearTimeout(_liveT[k]); _liveT[k] = setTimeout(fn, 350); };

function liveStart() {
    if (window._live) return;
    window._live = sb.channel('nm-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ratings' }, p => {
            const id = (p.new && p.new.title_id) || (p.old && p.old.title_id);
            if (id) _debounce('r' + id, () => refreshRating(id));
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'title_views' }, p => {
            const id = p.new && p.new.title_id;
            if (id) _debounce('v' + id, () => refreshViews(id));
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, p => {
            const r = p.new && p.new.title_id ? p.new : p.old;
            if (!r || !r.title_id || r.user_id === me.id) return;
            _debounce('l' + r.title_id, () => filmState(r.title_id).then(() => actsPaint(r.title_id)).catch(() => { }));
        })
        .subscribe();
}
</script>
